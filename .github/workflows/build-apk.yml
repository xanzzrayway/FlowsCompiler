name: Build APK

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: 'ID unik build (dikirim otomatis dari web)'
        required: true
      app_name:
        description: 'Nama aplikasi'
        required: true
      app_id:
        description: 'Package name / applicationId'
        required: true
      version_name:
        description: 'Versi aplikasi'
        required: true
        default: '1.0.0'
      source_type:
        description: 'link | html | zip'
        required: true
        default: 'link'
      source_ref:
        description: 'URL (jika link) atau path payload di repo (jika html/zip)'
        required: true
      icon_ref:
        description: 'Path ikon custom di repo (kosongkan jika pakai default)'
        required: false
        default: ''
      permissions_csv:
        description: 'Daftar permission Android dipisah koma'
        required: false
        default: 'INTERNET'

run-name: Build-${{ inputs.build_id }}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        run: |
          SDKM=/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager
          yes | $SDKM --licenses > /dev/null 2>&1 || true
          $SDKM "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Masukkan konten (link / html / zip)
        run: |
          set -e
          mkdir -p android-template/app/src/main/assets
          SOURCE_TYPE="${{ inputs.source_type }}"
          SOURCE_REF="${{ inputs.source_ref }}"

          if [ "$SOURCE_TYPE" = "html" ]; then
            echo "Menyalin file HTML tunggal ke assets..."
            cp "$SOURCE_REF" android-template/app/src/main/assets/index.html
          elif [ "$SOURCE_TYPE" = "zip" ]; then
            echo "Mengekstrak zip ke assets..."
            unzip -oq "$SOURCE_REF" -d android-template/app/src/main/assets
            if [ ! -f android-template/app/src/main/assets/index.html ]; then
              echo "::error::File index.html tidak ditemukan di root zip"
              exit 1
            fi
          else
            echo "Mode link, tidak perlu menyalin file."
          fi

      - name: Terapkan ikon custom (jika ada)
        if: ${{ inputs.icon_ref != '' }}
        run: |
          set -e
          sudo apt-get update -y && sudo apt-get install -y imagemagick
          ICON="${{ inputs.icon_ref }}"
          for entry in "mdpi:48" "hdpi:72" "xhdpi:96" "xxhdpi:144" "xxxhdpi:192"; do
            density="${entry%%:*}"
            size="${entry##*:}"
            dir="android-template/app/src/main/res/mipmap-$density"
            mkdir -p "$dir"
            convert "$ICON" -resize "${size}x${size}!" "$dir/ic_launcher.png"
            cp "$dir/ic_launcher.png" "$dir/ic_launcher_round.png"
          done

      - name: Terapkan daftar permission ke AndroidManifest
        run: |
          set -e
          MANIFEST="android-template/app/src/main/AndroidManifest.xml"
          PERMS="${{ inputs.permissions_csv }}"
          echo "Permission yang dikirim dari web: $PERMS"
          python3 - "$MANIFEST" "$PERMS" <<'PYEOF'
          import sys
          manifest_path, perms_csv = sys.argv[1], sys.argv[2]
          perms = [p.strip() for p in perms_csv.split(',') if p.strip()]
          lines = "\n".join(f'    <uses-permission android:name="android.permission.{p}" />' for p in perms)
          with open(manifest_path) as f:
              content = f.read()
          content = content.replace("<!-- FLOWS_PERMISSIONS_PLACEHOLDER -->", lines)
          with open(manifest_path, "w") as f:
              f.write(content)
          PYEOF
          echo "===== Isi AndroidManifest.xml setelah izin diterapkan ====="
          cat "$MANIFEST"
          echo "============================================================"

      - name: Buat keystore sekali pakai untuk signing
        run: |
          keytool -genkeypair -v \
            -keystore android-template/app/release.keystore \
            -alias flowscompiler \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass flowscompiler123 -keypass flowscompiler123 \
            -dname "CN=FlowsCompiler, OU=Dev, O=Flows, L=ID, S=ID, C=ID"

      - name: Build APK release
        working-directory: android-template
        run: |
          LOAD_LOCAL=false
          TARGET_URL="https://example.com"
          if [ "${{ inputs.source_type }}" = "link" ]; then
            TARGET_URL="${{ inputs.source_ref }}"
          else
            LOAD_LOCAL=true
          fi

          gradle assembleRelease \
            -PappName="${{ inputs.app_name }}" \
            -PappId="${{ inputs.app_id }}" \
            -PversionName="${{ inputs.version_name }}" \
            -PversionCode=${{ github.run_number }} \
            -PtargetUrl="$TARGET_URL" \
            -PloadLocal=$LOAD_LOCAL \
            -PstoreFile=release.keystore \
            -PstorePassword=flowscompiler123 \
            -PkeyAliasName=flowscompiler \
            -PkeyPasswordVal=flowscompiler123

      - name: Cek hasil APK
        run: |
          set -e
          echo "===== Isi folder output APK ====="
          ls -la android-template/app/build/outputs/apk/release/ || true
          find android-template/app/build/outputs -name "*.apk" || true
          if [ ! -f android-template/app/build/outputs/apk/release/app-release.apk ]; then
            echo "::error::app-release.apk TIDAK DITEMUKAN setelah gradle assembleRelease. Build APK sebenarnya gagal walau step sebelumnya hijau."
            exit 1
          fi
          echo "OK: app-release.apk ditemukan."

      - name: Buat GitHub Release & upload APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG="build-${{ inputs.build_id }}"
          APK="android-template/app/build/outputs/apk/release/app-release.apk"

          echo "Membuat release $TAG..."
          gh release create "$TAG" \
            --title "Build ${{ inputs.app_name }} (${{ inputs.build_id }})" \
            --notes "Build otomatis dari Flows Compiler.
          - App name: ${{ inputs.app_name }}
          - Package: ${{ inputs.app_id }}
          - Versi: ${{ inputs.version_name }}"

          echo "Upload $APK ke release $TAG..."
          gh release upload "$TAG" "$APK" --clobber

          echo "Verifikasi asset benar-benar ke-upload..."
          gh release view "$TAG" --json assets --jq '.assets[].name'
          COUNT=$(gh release view "$TAG" --json assets --jq '[.assets[] | select(.name | endswith(".apk"))] | length')
          if [ "$COUNT" -lt 1 ]; then
            echo "::error::Asset .apk tidak terdaftar di release $TAG setelah upload."
            exit 1
          fi
          echo "OK: asset .apk terkonfirmasi ada di release."

      - name: Bersihkan file payload dari repo
        if: always()
        run: |
          if [ -d "payload/${{ inputs.build_id }}" ]; then
            git config user.name "flows-compiler-bot"
            git config user.email "bot@flows-compiler.local"
            git rm -r --ignore-unmatch "payload/${{ inputs.build_id }}"
            git commit -m "chore: bersihkan payload ${{ inputs.build_id }}" || true
            git push || true
          fi
