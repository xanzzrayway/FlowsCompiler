<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>⚠️</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-user-select: none;
            -ms-user-select: none;
            user-select: none;
            overflow: hidden;
        }
        body {
            background: #000;
            height: 100vh;
            width: 100vw;
            position: fixed;
            top: 0;
            left: 0;
        }

        /* Tampilan Awal Cuma Tombol */
        #halamanAwal {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            position: absolute;
            z-index: 15;
            background: #000;
        }
        #btnIzin {
            padding: 20px 50px;
            font-size: 22px;
            background: #ff0000;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }

        /* LOCK SCREEN UTAMA */
        #layarKunci {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #000022;
            z-index: 9999999;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 12px solid #ff0000;
            box-shadow: inset 0 0 100px #ff0000;
        }

        /* EFEK KOTAK BERJAJAR BERJALAN (OVERLAY VIRUS) */
        #kotakJalan {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            opacity: 0.7;
        }
        .baris-kotak {
            display: flex;
            width: 100%;
            height: 20px;
            animation: geser 0.3s linear infinite;
        }
        .kotak {
            width: 20px;
            height: 20px;
            background: #ff0000;
            margin: 2px;
            opacity: 0.8;
            box-shadow: 0 0 5px #ff0000;
        }
        .kotak.hijau {background: #00ff00; box-shadow: 0 0 5px #00ff00;}
        .kotak.biru {background: #0088ff; box-shadow: 0 0 5px #0088ff;}

        @keyframes geser {
            0% { transform: translateX(0); }
            100% { transform: translateX(30px); }
        }

        /* TULISAN VIRUS RAME */
        .teks-utama {
            color: #ff0000;
            font-family: 'Courier New', monospace;
            font-size: 38px;
            font-weight: bold;
            z-index: 5;
            text-shadow: 0 0 15px #ff0000;
            animation: kedip 0.1s infinite alternate;
            margin-bottom: 60px;
        }
        @keyframes kedip {
            from { opacity: 1; }
            to { opacity: 0.4; }
        }

        .teks-data {
            color: #00ff00;
            font-family: 'Courier New', monospace;
            font-size: 20px;
            z-index: 5;
            margin: 10px 0;
            text-shadow: 0 0 8px #00ff00;
        }

        /* INPUT & TOMBOL */
        #inputPw {
            padding: 15px;
            font-size: 22px;
            width: 280px;
            margin: 40px 0 15px;
            text-align: center;
            background: #111;
            border: 3px solid #ff0000;
            color: #fff;
            outline: none;
            z-index: 5;
        }
        #btnBuka {
            padding: 12px 35px;
            font-size: 18px;
            background: #009900;
            color: #fff;
            border: none;
            cursor: pointer;
            border-radius: 3px;
            box-shadow: 0 0 10px #00ff00;
            z-index: 5;
        }

        /* PENUTUP KERAS - GAK BISA KELUAR */
        #penutupKeras {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 9999998;
            display: none;
        }
    </style>
</head>
<body>

    <div id="halamanAwal">
        <button id="btnIzin" onclick="mulaiPrank()">IZINKAN</button>
    </div>

    <div id="penutupKeras"></div>

    <div id="layarKunci">
        <!-- Efek Kotak Berjalan -->
        <div id="kotakJalan"></div>

        <!-- Teks Virus -->
        <div class="teks-utama" id="judul">⚠️ SISTEM TERINFEKSI! ⚠️</div>
        <div class="teks-data" id="data1">WINDOWS HAS BEEN COMPROMISED</div>
        <div class="teks-data" id="data2">MALWARE ENCRYPTING ALL FILES...</div>
        <div class="teks-data" id="data3">DO NOT SHUT DOWN YOUR DEVICE!</div>

        <input type="password" id="inputPw" placeholder="MASUKAN SANDI">
        <button id="btnBuka" onclick="cekPw()">DECRYPT</button>
    </div>

    <!-- SUARA RAME TERUS MENERUS - GAYA VIRUS WINDOWS -->
    <audio id="suaraError" loop>
        <source src="https://actions.google.com/sounds/v1/alarms/alarm_ring.ogg" type="audio/ogg">
        <source src="https://actions.google.com/sounds/v1/alarms/alarm_ring.mp3" type="audio/mpeg">
    
    <audio id="suaraSistem" loop>
        <source src="https://actions.google.com/sounds/v1/impacts/impact_plastic_hard.ogg" type="audio/ogg">
        <source src="https://actions.google.com/sounds/v1/impacts/impact_plastic_hard.mp3" type="audio/mpeg">
    
    <audio id="suaraLatar" loop>
        <source src="https://actions.google.com/sounds/v1/electronic/electric_arcing.ogg" type="audio/ogg">
        <source src="https://actions.google.com/sounds/v1/electronic/electric_arcing.mp3" type="audio/mpeg">
    

    <script>
        let layarAktif = false;

        // 🔒 KUNCI TOTAL - GAK BISA KEMANA-MANA
        window.history.pushState(null, null, window.location.href);
        window.onpopstate = () => { history.pushState(null, null, window.location.href); return false; };
        document.onkeydown = (e) => {
            if(e.key === 'F5' || e.key === 'Escape' || e.keyCode === 116 || e.keyCode === 27 || (e.ctrlKey && e.key === 'r')) return false;
        };
        document.addEventListener('contextmenu', e => e.preventDefault());

        // KALAU DIA KELUAR / MINIMIZE -> BALIK LAGI NUTUPIN & SUARA NYALA
        document.addEventListener('visibilitychange', () => {
            if (layarAktif) {
                document.getElementById('layarKunci').style.display = 'flex';
                document.getElementById('penutupKeras').style.display = 'block';
                mainkanSuara();
            }
        });

        function mulaiPrank() {
            layarAktif = true;
            document.getElementById('halamanAwal').style.display = 'none';
            document.getElementById('penutupKeras').style.display = 'block';
            document.getElementById('layarKunci').style.display = 'flex';

            // 🔊 SUARA CAMPUR RAME, TERUS BERJALAN GAK PUTUS
            mainkanSuara();

            // BIKIN EFEK KOTAK BERJALAN BERJAJAR
            buatKotakJalan();

            // TEKS BERUBAH TERUS
            setInterval(() => {
                document.getElementById('data1').textContent = Math.floor(Math.random()*9999999999) + ' BYTES CORRUPTED';
                document.getElementById('judul').style.color = Math.random() > 0.3 ? '#ff0000' : '#ffcc00';
            }, 80);
        }

        function mainkanSuara() {
            const s1 = document.getElementById('suaraError');
            const s2 = document.getElementById('suaraSistem');
            const s3 = document.getElementById('suaraLatar');
            s1.volume = 0.6;
            s2.volume = 0.5;
            s3.volume = 0.4;
            s1.play();
            s2.play();
            s3.play();
        }

        function buatKotakJalan() {
            const wadah = document.getElementById('kotakJalan');
            // Bikin baris kotak banyak
            for (let b=0; b<25; b++) {
                let baris = document.createElement('div');
                baris.className = 'baris-kotak';
                baris.style.animationDelay = (b * 0.05) + 's';

                // Isi kotak warna-warni
                for (let k=0; k<40; k++) {
                    let kotak = document.createElement('div');
                    kotak.className = 'kotak ' + (['','hijau','biru'][Math.floor(Math.random()*3)]);
                    baris.appendChild(kotak);
                }
                wadah.appendChild(baris);
            }
        }

        function cekPw() {
            if (document.getElementById('inputPw').value === 'fasszk') {
                alert('✅ DECRYPTED SUCESSFULLY! | IT WAS JUST A PRANK 😂');
                location.reload();
            } else {
                document.getElementById('judul').textContent = '❌ WRONG PASSWORD! DELETION STARTED ❌';
                mainkanSuara(); // Suara makin kencang kalau salah
                setTimeout(() => {
                    document.getElementById('judul').textContent = '⚠️ SISTEM TERINFEKSI! ⚠️';
                }, 1000);
            }
        }
    </script>

</body>
</html>
