button{background:#071b0e;color:var(--g);border:1px solid #267340;border-radius:5px;padding:11px 9px;font:12px monospace;cursor:pointer}

.searchrow{display:flex;gap:8px;margin:10px 0}
.searchrow input{flex:1;min-width:0}
.filters{display:flex;gap:7px;overflow:auto;padding-bottom:8px;margin-bottom:10px}
.filters button{white-space:nowrap}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.tool{min-height:80px;text-align:right;display:flex;flex-direction:column;justify-content:space-between;gap:9px}
.tool strong{font-size:12px}
.tool small{font-size:10px;color:var(--muted);line-height:1.4}
.tag{font-size:9px;color:#d3ffe0;border:1px solid #17482b;border-radius:4px;padding:3px 5px;align-self:flex-start}
#workspace{display:none}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.actions button{flex:1}
.output{white-space:pre-wrap;overflow-wrap:anywhere;background:#010302;border:1px solid #17482b;border-radius:5px;padding:12px;min-height:75px;color:#c0ffd1;line-height:1.65;margin-top:10px}
#terminal{height:230px;overflow:auto;background:#010302;padding:10px;border:1px solid #17482b;line-height:1.7;font-size:11px;white-space:pre-wrap}
#screen{display:none;position:fixed;inset:0;z-index:10;background:#000;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:20px}
#mask{width:min(72vw,300px);height:auto;filter:drop-shadow(0 0 20px #00ff7755)}
#timer{font-size:30px;margin:12px}
#bar{width:75%;height:3px;background:#17311f}
#progress{height:100%;width:0;background:var(--g)}
footer{text-align:center;color:#50785d;font-size:10px;padding:18px}
.hidden{display:none!important}
@media(min-width:650px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.hero{padding:20px}.tool{min-height:90px}}
</style>
