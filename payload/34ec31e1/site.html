  if(h>SEA+1&&!gb(a,h+1,b)&&!gb(a,h+2,b)){P.x=a+.5;P.y=h+1.01;P.z=b+.5;P.top=P.y;return}}P.x=.5;P.z=.5;P.y=SEA+4;P.top=P.y}
function cast(){const cp=Math.cos(P.pitch),d=[-Math.sin(P.yaw)*cp,Math.sin(P.pitch),-Math.cos(P.yaw)*cp],o=[P.x,P.y+EYE,P.z],p=o.map(Math.floor),st=d.map(v=>v>0?1:-1),
 td=d.map(v=>Math.abs(v)<1e-6?1e9:1/Math.abs(v)),tm=d.map((v,i)=>(st[i]>0?p[i]+1-o[i]:o[i]-p[i])*td[i]);let nm=[0,0,0];
 for(;;){if(IT[gb(p[0],p[1],p[2])].s)return{p:[...p],n:nm};const a=tm[0]<tm[1]&&tm[0]<tm[2]?0:tm[1]<tm[2]?1:2,t=tm[a];p[a]+=st[a];tm[a]+=td[a];nm=[0,0,0];nm[a]=-st[a];if(t>5)return null}}
const use=()=>{const s=inv[sel];if(--s.n<=0)inv[sel]=null;ui()};
function place(){const s=inv[sel];if(!s)return;const it=IT[s.id];if(it.f){if(!cre&&P.hun<20){P.hun=Math.min(20,P.hun+it.f);use()}return}if(it.i)return;
 const h=cast();if(!h)return;const[x,y,z]=h.p.map((v,i)=>v+h.n[i]),b=gb(x,y,z);if((b&&b!=5)||y<1||y>=CH)return;
 if(it.s&&P.x+HW>x&&P.x-HW<x+1&&P.z+HW>z&&P.z-HW<z+1&&P.y+PH>y&&P.y<y+1)return;set(x,y,z,s.id);if(!cre)use()}
let lp=null,lx,ly,lt,lm,sx,sy,brk=0,bt=0,bk=null;
function act(dt){const h=cast();hl.visible=!!h;if(h)hl.position.set(h.p[0]+.5,h.p[1]+.5,h.p[2]+.5);
 if(lp!==null&&!lm&&!brk&&performance.now()-lt>280)brk=1;
 if(!(brk&&h)){bt=0;bk=null;$('#bar').hidden=true;return}
 const k=h.p.join();if(k!=bk){bk=k;bt=0}const b=gb(...h.p),it=IT[b],s=inv[sel],pw=s&&IT[s.id].w||1,need=cre?.2:Math.max(.1,it.h/(it.pk?pw:1));
 bt+=dt;$('#bar').hidden=false;$('#bar b').style.width=Math.min(100,bt/need*100)+'%';
 if(bt>=need){bt=0;bk=null;if(h.p[1]>0){set(h.p[0],h.p[1],h.p[2],0);if(!cre){const dr=it.d===undefined?b:it.d;if(dr>0&&(!it.pk||pw>1))add(dr,1);if(b==7&&Math.random()<.08)add(21,1)}}}}
/* ===== INVENTORY ===== */
const inv=Array(36).fill(null),mx_=id=>IT[id].m||64;
function add(id,n){for(let i=0;i<36&&n>0;i++){const s=inv[i];if(s&&s.id==id&&s.n<mx_(id)){const a=Math.min(n,mx_(id)-s.n);s.n+=a;n-=a}}
 for(let i=0;i<36&&n>0;i++)if(!inv[i]){const a=Math.min(n,mx_(id));inv[i]={id,n:a};n-=a}ui()}
const cnt=id=>inv.reduce((a,s)=>a+(s&&s.id==id?s.n:0),0);
function take(id,n){for(let i=35;i>=0&&n>0;i--){const s=inv[i];if(s&&s.id==id){const a=Math.min(n,s.n);s.n-=a;n-=a;if(!s.n)inv[i]=null}}}
const can=r=>r[2].every(([i,n])=>cnt(i)>=n);
function slot(s,on,cb){const d=document.createElement('div');d.className='sl'+(on?' on':'');if(s){d.append(ico(s.id));if(s.n>1&&!cre){const b=document.createElement('b');b.textContent=s.n;d.append(b)}}d.onclick=cb;return d}
function ui(){$('#hb').replaceChildren(...inv.slice(0,9).map((s,i)=>slot(s,i==sel,()=>{sel=i;ui()})));
 const h=Math.ceil(P.hp/2),f=Math.ceil(P.hun/2);$('#st').textContent=cre?'':'♥'.repeat(h)+'♡'.repeat(10-h)+'   '+'●'.repeat(f)+'○'.repeat(10-f);if(S=='inv')invUI()}
function tap(i){if(cre){sel=i;ui();return}if(mvf<0){if(inv[i])mvf=i;if(i<9)sel=i}else{const a=mvf,x=inv[a],y=inv[i];mvf=-1;
 if(a!=i){if(x&&y&&x.id==y.id){const m=Math.min(x.n,mx_(x.id)-y.n);y.n+=m;x.n-=m;if(!x.n)inv[a]=null}else{inv[a]=y;inv[i]=x}}}ui()}
function invUI(){$('#it').textContent=cre?'Все предметы':'Инвентарь';
 $('#ig').replaceChildren(...(cre?PAL.map(id=>slot({id,n:1},0,()=>{inv[sel]={id,n:1};ui()})):inv.slice(9).map((s,k)=>slot(s,mvf==k+9,()=>tap(k+9)))));
 $('#ih').replaceChildren(...inv.slice(0,9).map((s,i)=>slot(s,mvf==i||(sel==i&&mvf<0),()=>tap(i))));
 $('#cr').replaceChildren(...(cre?[]:RC.map(r=>{const b=document.createElement('button');b.className='rc';b.style.opacity=can(r)?1:.45;b.append(ico(r[0]),`${IT[r[0]].n} ×${r[1]} ← ${r[2].map(([i,n])=>IT[i].n+' ×'+n).join(', ')}`);
  b.onclick=()=>{if(can(r)){r[2].forEach(([i,n])=>take(i,n));add(r[0],r[1])}};return b})))}
/* ===== UI / INPUT ===== */
function go(s){S=s;['menu','pause','dead','inv'].forEach(n=>$('#'+n).hidden=n!=s);$('#hud').hidden=s!='play';if(s=='inv'){mvf=-1;invUI()}lp=null;brk=0;J.x=J.y=0;JB=DB=0}
function start(m){cre=m;seed=1+Math.random()*1e6|0;W.forEach(drop);W.clear();G.clear();inv.fill(null);Object.assign(P,{hp:20,hun:20,ht:0,rt:0,yaw:0,pitch:0,fly:0,og:0});
 if(cre)[1,2,3,4,6,7,8,9,5].forEach((id,i)=>inv[i]={id,n:1});sel=0;mkOff();scene.fog.near=R*7;scene.fog.far=R*16-6;cam.far=R*16+30;cam.updateProjectionMatrix();
 P.x=.5;P.z=.5;stream(1e5,9);spawn();$('#fly').hidden=!cre;go('play');ui()}
$('#m1').onclick=()=>start(0);$('#m2').onclick=()=>start(1);$('#mr').onclick=()=>{R=RS[(RS.indexOf(R)+1)%3];$('#mr').textContent='Дальность: '+R};$('#mr').textContent='Дальность: '+R;
$('#p1').onclick=()=>go('play');$('#p2').onclick=$('#d2').onclick=()=>go('menu');$('#bps').onclick=()=>go('pause');$('#binv').onclick=$('#ic').onclick=()=>go(S=='inv'?'play':'inv');
$('#d1').onclick=()=>{P.hp=P.hun=20;spawn();ui();go('play')};$('#fly').onclick=()=>{P.fly=!P.fly;P.vy=0};
const hold=(id,f)=>{const e=$(id);e.onpointerdown=()=>f(1);e.onpointerup=e.onpointercancel=e.onpointerleave=()=>f(0)};hold('#jmp',v=>JB=v);hold('#dn',v=>DB=v);
const joy=$('#joy'),kn=joy.firstElementChild;let jid=null;
function jm(e){const r=joy.getBoundingClientRect(),dx=e.clientX-r.left-r.width/2,dy=e.clientY-r.top-r.height/2,m=Math.min(1,Math.hypot(dx,dy)/50),a=Math.atan2(dy,dx);J.x=Math.cos(a)*m;J.y=Math.sin(a)*m;kn.style.transform=`translate(${J.x*50}px,${J.y*50}px)`}
joy.onpointerdown=e=>{jid=e.pointerId;joy.setPointerCapture(jid);jm(e)};joy.onpointermove=e=>{if(e.pointerId==jid)jm(e)};
joy.onpointerup=joy.onpointercancel=()=>{jid=null;J.x=J.y=0;kn.style.transform=''};
const cv=$('#c');
cv.onpointerdown=e=>{if(lp!==null||S!='play')return;lp=e.pointerId;cv.setPointerCapture(lp);lx=sx=e.clientX;ly=sy=e.clientY;lt=performance.now();lm=0;brk=0};
cv.onpointermove=e=>{if(e.pointerId!=lp)return;P.yaw-=(e.clientX-lx)*.006;P.pitch=Math.max(-1.55,Math.min(1.55,P.pitch-(e.clientY-ly)*.006));lx=e.clientX;ly=e.clientY;if(!brk&&Math.hypot(lx-sx,ly-sy)>14)lm=1};
cv.onpointerup=cv.onpointercancel=e=>{if(e.pointerId!=lp)return;if(!lm&&!brk&&performance.now()-lt<280)place();lp=null;brk=0};
const KM={KeyW:'w',KeyA:'a',KeyS:'s',KeyD:'d',Space:'sp',ShiftLeft:'sh'};
onkeydown=e=>{if(KM[e.code])K[KM[e.code]]=1;if(e.code=='KeyE'&&(S=='play'||S=='inv'))go(S=='inv'?'play':'inv');if(e.code=='Escape'&&S=='play')go('pause')};onkeyup=e=>{if(KM[e.code])K[KM[e.code]]=0};
document.onvisibilitychange=()=>{if(document.hidden&&S=='play')go('pause')};
function fit(){const d=Math.min(devicePixelRatio||1,1.5);rd.setPixelRatio(d);rd.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()}
onresize=fit;fit();
let last=performance.now(),fa=0,fps=60,ia=0;
function loop(){requestAnimationFrame(loop);const n=performance.now(),dt=Math.min((n-last)/1000,.05);last=n;fps+=(1/Math.max(dt,.001)-fps)*.05;

  $('#dn').hidden=!P.fly;$('#uw').style.display=P.hw?'block':'none';
  if((ia+=dt)>.3){ia=0;$('#info').textContent=(cre?'Креатив':'Выживание')+'  FPS '+fps.toFixed(0)+'\nXYZ '+[P.x,P.y,P.z].map(v=>v.toFixed(0)).join(' ')+'\nЧанки '+W.size}}
 else hl.visible=false;
