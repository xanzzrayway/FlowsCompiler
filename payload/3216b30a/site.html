<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Chat 8C</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: linear-gradient(160deg, #e0e7ff, #ede9fe 50%, #fef3c7);
      color: #1e293b;
      display: flex; align-items: center; justify-content: center;
      min-height: 100dvh; padding: 24px;
    }
    .box {
      width: 100%; max-width: 360px; text-align: center;
      background: rgba(255,255,255,.88); border-radius: 22px;
      padding: 28px 22px; border: 1px solid rgba(99,102,241,.25);
      box-shadow: 0 20px 50px rgba(99,102,241,.2);
    }
    .logo {
      width: 72px; height: 72px; border-radius: 20px; margin: 0 auto 14px;
      background: linear-gradient(135deg, #6366f1, #a855f7);
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-weight: 900; font-size: 1.2rem;
      box-shadow: 0 10px 28px rgba(99,102,241,.4);
    }
    h1 { font-size: 1.2rem; margin-bottom: 6px; }
    p { color: #64748b; font-size: .88rem; line-height: 1.45; margin-bottom: 14px; }
    .spin {
      width: 28px; height: 28px; margin: 10px auto;
      border: 3px solid rgba(99,102,241,.2); border-top-color: #6366f1;
      border-radius: 50%; animation: s 0.8s linear infinite;
    }
    @keyframes s { to { transform: rotate(360deg); } }
    .err { color: #dc2626; font-size: .85rem; margin-top: 10px; display: none; }
    button {
      margin-top: 12px; width: 100%; padding: 12px; border: none; border-radius: 12px;
      background: linear-gradient(135deg, #6366f1, #a855f7); color: #fff;
      font-weight: 700; font-size: .95rem; cursor: pointer;
    }
    .by { margin-top: 16px; font-size: .72rem; color: #94a3b8; }
    .by b { color: #7c3aed; }
  </style>
</head>
<body>
  <div class="box">
    <div class="logo">8C</div>
    <h1>Chat nhóm lớp 8C</h1>
    <p id="status">Đang tải bản mới nhất…</p>
    <div class="spin" id="spin"></div>
    <p class="err" id="err"></p>
    <button id="btn-retry" style="display:none" type="button">Thử lại</button>
    <div class="by">by <b>khanhhuy</b></div>
  </div>

  <script>
    /**
     * ============================================================
     *  CHỈ CẦN SỬA 1 DÒNG NÀY (một lần khi đóng APK)
     *  Dán link file HTML chat online của bạn.
     *  Sau này update chat: chỉ sửa file trên link đó — KHÔNG cần build APK lại.
     * ============================================================
     */
    const APP_HTML_URL = "https://magnificent-crisp-a8361a.netlify.app/";

    // Firebase (để đọc version + link dự phòng nếu bạn cấu hình)
    const FB_DB = "https://lopchat-75c38-default-rtdb.asia-southeast1.firebasedatabase.app";
    const META_URL = FB_DB + "/rooms/8c/users/_appmeta.json";

    const statusEl = document.getElementById("status");
    const errEl = document.getElementById("err");
    const spin = document.getElementById("spin");
    const btn = document.getElementById("btn-retry");

    function showErr(msg) {
      spin.style.display = "none";
      errEl.style.display = "block";
      errEl.textContent = msg;
      btn.style.display = "block";
      statusEl.textContent = "Không tải được app";
    }

    async function getMeta() {
      try {
        const r = await fetch(META_URL + "?t=" + Date.now(), { cache: "no-store" });
        if (!r.ok) return null;
        return await r.json();
      } catch (e) {
        return null;
      }
    }

    async function boot() {
      spin.style.display = "block";
      errEl.style.display = "none";
      btn.style.display = "none";
      statusEl.textContent = "Đang tải bản mới nhất…";

      let url = APP_HTML_URL;
      let ver = String(Date.now());

      // Nếu đã cấu hình link + version trên Firebase → ưu tiên (đổi link mà không sửa APK)
      const meta = await getMeta();
      if (meta && meta.htmlUrl && /^https?:\/\//i.test(meta.htmlUrl)) {
        url = meta.htmlUrl;
      }
      if (meta && meta.version) ver = String(meta.version);

      if (!url || url.indexOf("YOUR_HOST_HERE") >= 0) {
        showErr("Chưa cấu hình link HTML. Sửa APP_HTML_URL trong loader hoặc ghi htmlUrl lên Firebase _appmeta.");
        return;
      }

      // Chống cache WebView / APK
      const sep = url.indexOf("?") >= 0 ? "&" : "?";
      const finalUrl = url + sep + "v=" + encodeURIComponent(ver) + "&_=" + Date.now();

      statusEl.textContent = "Đang mở chat…";
      // Chuyển hẳn sang bản online (mọi update HTML online = cả lớp thấy)
      window.location.replace(finalUrl);
    }

    btn.onclick = boot;
    boot();
  </script>
</body>
</html>
