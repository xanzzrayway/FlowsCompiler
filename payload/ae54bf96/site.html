<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⚠️ WARNING</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%;overflow:auto}
body{
  min-height:100vh;background:#050000;color:#fff;
  font-family:Arial,sans-serif;display:flex;
  justify-content:center;align-items:center;text-align:center;
  animation:flash .35s infinite;
}
.container{
  width:92%;max-width:430px;padding:30px 20px;
  border:3px solid red;border-radius:22px;background:rgba(20,0,0,.95);
  box-shadow:0 0 20px red,0 0 60px #800;
  animation:shake .12s infinite;
}
.warning{font-size:70px;margin-bottom:10px}
h1{margin:5px 0 18px;color:#ff1010;font-size:29px;text-shadow:0 0 15px red}
p{font-size:18px;line-height:1.5}
.phone{color:#ff3030;font-size:23px;font-weight:bold;text-shadow:0 0 10px red}
@keyframes flash{0%,100%{background:#050000}50%{background:#3d0000}}
@keyframes shake{
  0%{transform:translate(0)}25%{transform:translate(2px,-2px)}
  50%{transform:translate(-2px,2px)}75%{transform:translate(2px,2px)}
  100%{transform:translate(-2px,-2px)}
}
</style>
</head>
<body>
<div class="container">
  <div class="warning">⚠️</div>
  <h1>HP ANDA TERKENA VIRUS</h1>
  <p>SILAKAN HUBUNGI TIM KAMI</p>
  <div class="phone">082395425065</div>
</div>

<script>
let running = true;
let vibrationTimer = null;
let audioCtx = null;
let oscillator = null;
let gain = null;
let toneTimer = null;

function vibrateLoop(){
  if(!running) return;
  if(navigator.vibrate) navigator.vibrate([250,100,250,100,400]);
}

vibrateLoop();
vibrationTimer = setInterval(vibrateLoop,1600);

function startSound(){
  if(!running || audioCtx) return;
  const AC = window.AudioContext || window.webkitAudioContext;
  if(!AC) return;

  audioCtx = new AC();
  oscillator = audioCtx.createOscillator();
  gain = audioCtx.createGain();

  oscillator.type = "square";
  oscillator.frequency.value = 800;
  gain.gain.value = 0.08;

  oscillator.connect(gain);
  gain.connect(audioCtx.destination);
  oscillator.start();

  toneTimer = setInterval(()=>{
    if(oscillator && running)
      oscillator.frequency.value =
        oscillator.frequency.value === 800 ? 1200 : 800;
  },300);
}

document.addEventListener("click",startSound,{once:true});

function stopEffects(){
  running = false;

  if(vibrationTimer) clearInterval(vibrationTimer);
  if(toneTimer) clearInterval(toneTimer);

  if(navigator.vibrate) navigator.vibrate(0);

  if(oscillator){
    try{ oscillator.stop(); }catch(e){}
    oscillator.disconnect();
    oscillator = null;
  }

  if(gain){
    try{ gain.disconnect(); }catch(e){}
    gain = null;
  }

  if(audioCtx){
    try{ audioCtx.close(); }catch(e){}
    audioCtx = null;
  }
}

// Penting: saat Back/keluar/tab ditinggalkan, semua efek dihentikan.
window.addEventListener("pagehide",stopEffects);
window.addEventListener("beforeunload",stopEffects);
document.addEventListener("visibilitychange",()=>{
  if(document.hidden) stopEffects();
});
</script>
</body>
</html>
