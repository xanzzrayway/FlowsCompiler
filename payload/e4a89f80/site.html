<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Voice Recorder - Qwerty</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            background-color: #f8fafc;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: #1e293b;
            padding: 20px;
        }

        .container {
            background: #ffffff;
            width: 100%;
            max-width: 450px;
            padding: 40px 30px;
            border-radius: 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.04);
            text-align: center;
            border: 1px solid #f1f5f9;
        }

        h2 {
            font-size: 24px;
            font-weight: 800;
            margin-bottom: 6px;
            color: #0f172a;
        }

        p.subtitle {
            font-size: 14px;
            color: #64748b;
            margin-bottom: 30px;
        }

        /* Tombol Ijo Glow */
        .btn-glow {
            background: #2ecc71;
            color: #ffffff;
            border: none;
            padding: 16px 32px;
            font-size: 15px;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 25px rgba(46, 204, 113, 0.35);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            outline: none;
        }

        .btn-glow:hover {
            background: #27ae60;
            box-shadow: 0 12px 30px rgba(46, 204, 113, 0.55);
            transform: translateY(-2px);
        }

        #recorder-section {
            display: none;
        }

        .visualizer-container {
            background: #f8fafc;
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 25px;
            border: 1px solid #e2e8f0;
            height: 150px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        canvas {
            width: 100%;
            height: 100%;
        }

        .status-badge {
            display: inline-block;
            padding: 6px 16px;
            background: #f1f5f9;
            color: #64748b;
            border-radius: 50px;
            font-size: 12px;
            font-weight: 700;
            margin-bottom: 25px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .status-badge.recording {
            background: rgba(239, 68, 68, 0.1);
            color: #ef4444;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 0.6; }
            50% { opacity: 1; }
            100% { opacity: 0.6; }
        }

        .control-btns {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
        }

        .btn-circle {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            outline: none;
        }

        .btn-record {
            background: #2ecc71;
            box-shadow: 0 8px 25px rgba(46, 204, 113, 0.3);
            color: white;
        }

        .btn-record:hover {
            transform: scale(1.08);
            background: #27ae60;
        }

        .btn-stop {
            background: #ef4444;
            box-shadow: 0 8px 25px rgba(239, 68, 68, 0.3);
            color: white;
            display: none;
        }

        .btn-stop:hover {
            transform: scale(1.08);
            background: #dc2626;
        }

        .btn-circle svg {
            width: 24px;
            height: 24px;
            fill: currentColor;
        }

        /* Panel Efek & Playback */
        .effects-panel {
            display: none;
            background: #f8fafc;
            border-radius: 24px;
            padding: 20px;
            border: 1px solid #e2e8f0;
            margin-top: 15px;
            animation: slideUp 0.4s ease;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .effects-title {
            font-size: 13px;
            font-weight: 700;
            color: #94a3b8;
            text-transform: uppercase;
            margin-bottom: 12px;
            letter-spacing: 0.5px;
        }

        .effects-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
        }

        .btn-effect {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            padding: 10px;
            font-size: 13px;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
            color: #475569;
        }

        .btn-effect.active {
            background: #2ecc71;
            color: white;
            border-color: #2ecc71;
            box-shadow: 0 4px 12px rgba(46, 204, 113, 0.2);
        }

        /* Playback Custom Controls */
        .playback-controls {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #ffffff;
            padding: 12px 18px;
            border-radius: 14px;
            border: 1px solid #edf2f7;
            margin-bottom: 15px;
        }

        .btn-play-pause {
            background: #f1f5f9;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: #1e293b;
            transition: all 0.2s;
        }

        .btn-play-pause:hover {
            background: #e2e8f0;
        }

        .playback-info {
            font-size: 13px;
            font-weight: 600;
            color: #475569;
        }

        /* Tombol Download Ijo Glow */
        .btn-download {
            width: 100%;
            background: #2ecc71;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 14px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.3s;
            box-shadow: 0 6px 18px rgba(46, 204, 113, 0.25);
        }

        .btn-download:hover {
            background: #27ae60;
            box-shadow: 0 8px 22px rgba(46, 204, 113, 0.4);
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Voice Recorder</h2>
        <p class="subtitle" id="info-text">Yuk, izinin akses mikrofon dulu buat mulai rekam suara kece lu.</p>

        <!-- Tahap 1: Minta Izin -->
        <div id="permission-section">
            <button id="btn-request" class="btn-glow">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" x2="12" y1="19" y2="22"/></svg>
                Minta Izin Audio
            </button>
        </div>

        <!-- Tahap 2: Tampilan Recorder -->
        <div id="recorder-section">
            <span id="status-tag" class="status-badge">Siap Merekam</span>
            
            <div class="visualizer-container">
                <canvas id="visualizer"></canvas>
            </div>

            <div class="control-btns">
                <button id="btn-start" class="btn-circle btn-record" title="Mulai Rekam">
                    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="6"/></svg>
                </button>
                <button id="btn-stop" class="btn-circle btn-stop" title="Berhenti">
                    <svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="1.5"/></svg>
                </button>
            </div>

            <!-- Panel Efek & Playback (Muncul abis beres rekam) -->
            <div id="effects-panel" class="effects-panel">
                <div class="effects-title">Pilih Efek Suara</div>
                <div class="effects-grid">
                    <button class="btn-effect active" data-effect="normal">Normal</button>
                    <button class="btn-effect" data-effect="reverse">Putar Balik 🔄</button>
                    <button class="btn-effect" data-effect="chipmunk">Chipmunk 🐿️</button>
                    <button class="btn-effect" data-effect="deep">Suara Berat 🤖</button>
                </div>

                <div class="playback-controls">
                    <button id="btn-play-pause" class="btn-play-pause">
                        <!-- Play Icon -->
                        <svg id="play-icon" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
                        <!-- Pause Icon -->
                        <svg id="pause-icon" width="18" height="18" viewBox="0 0 24 24" fill="currentColor" style="display:none;"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                    </button>
                    <div class="playback-info" id="playback-status">Hasil rekaman siap!</div>
                </div>

                <button id="btn-download" class="btn-download">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                    Simpan Ke Memori
                </button>
            </div>
        </div>
    </div>

    <script>
        let mediaRecorder;
        let audioChunks = [];
        let audioCtx;
        let analyser;
        let dataArray;
        let bufferLength;
        let sourceNode;
        let animationFrameId;
        let stream;
        let recordingMimeType = '';
        
        // Audio Buffer untuk manipulasi efek
        let originalAudioBuffer = null;
        let processedAudioBuffer = null;
        let currentSourceNode = null; 
        let isPlaying = false;
        let activeEffect = 'normal';

        const permissionSection = document.getElementById('permission-section');
        const recorderSection = document.getElementById('recorder-section');
        const btnRequest = document.getElementById('btn-request');
        const btnStart = document.getElementById('btn-start');
        const btnStop = document.getElementById('btn-stop');
        const statusTag = document.getElementById('status-tag');
        const infoText = document.getElementById('info-text');
        const canvas = document.getElementById('visualizer');
        const canvasCtx = canvas.getContext('2d');
        const effectsPanel = document.getElementById('effects-panel');
        const btnPlayPause = document.getElementById('btn-play-pause');
        const playIcon = document.getElementById('play-icon');
        const pauseIcon = document.getElementById('pause-icon');
        const playbackStatus = document.getElementById('playback-status');
        const btnDownload = document.getElementById('btn-download');
        const effectButtons = document.querySelectorAll('.btn-effect');

        function resizeCanvas() {
            canvas.width = canvas.clientWidth * window.devicePixelRatio;
            canvas.height = canvas.clientHeight * window.devicePixelRatio;
        }
        window.addEventListener('resize', resizeCanvas);

        // Akses Mic
        btnRequest.addEventListener('click', async () => {
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                alert('Browser/WebView ini tidak mendukung akses mikrofon, atau halaman tidak dibuka lewat HTTPS/localhost.');
                return;
            }

            try {
                stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                initAudioContext(stream);
                
                permissionSection.style.display = 'none';
                recorderSection.style.display = 'block';
                infoText.textContent = 'Pencet tombol ijo bulat di bawah untuk mulai rekam suara lu.';
                resizeCanvas();
                drawIdleVisualizer();
            } catch (err) {
                console.error(err);
                if (err.name === 'NotAllowedError' || err.name === 'PermissionDeniedError') {
                    alert('Izin mikrofon ditolak. Buka pengaturan izin browser/aplikasi dan aktifkan akses mikrofon untuk situs ini, lalu coba lagi.');
                } else if (err.name === 'NotFoundError') {
                    alert('Mikrofon tidak ditemukan di perangkat ini.');
                } else {
                    alert('Akses mic gagal: ' + err.message);
                }
            }
        });

        function initAudioContext(audioStream) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            analyser = audioCtx.createAnalyser();
            analyser.fftSize = 64; // Bikin jarumnya pas ga terlalu padat
            bufferLength = analyser.frequencyBinCount;
            dataArray = new Uint8Array(bufferLength);
            
            sourceNode = audioCtx.createMediaStreamSource(audioStream);
            sourceNode.connect(analyser);

            // Pilih format rekaman terbaik yang didukung browser
            const preferredMimeTypes = [
                'audio/webm;codecs=opus',
                'audio/webm',
                'audio/ogg;codecs=opus',
                'audio/mp4'
            ];
            recordingMimeType = preferredMimeTypes.find(t => window.MediaRecorder && MediaRecorder.isTypeSupported(t)) || '';

            mediaRecorder = recordingMimeType
                ? new MediaRecorder(audioStream, { mimeType: recordingMimeType })
                : new MediaRecorder(audioStream);

            mediaRecorder.ondataavailable = (event) => {
                if (event.data && event.data.size > 0) audioChunks.push(event.data);
            };

            mediaRecorder.onstop = async () => {
                const audioBlob = new Blob(audioChunks, { type: mediaRecorder.mimeType || recordingMimeType || 'audio/webm' });
                audioChunks = [];
                
                // Decode data audio biar bisa dimanipulasi per-sampel
                const arrayBuffer = await audioBlob.arrayBuffer();
                audioCtx.decodeAudioData(arrayBuffer, (decodedBuffer) => {
                    originalAudioBuffer = decodedBuffer;
                    applyEffect('normal'); // Default pas beres rekam
                    effectsPanel.style.display = 'block';
                }, (decodeErr) => {
                    console.error('Gagal decode audio:', decodeErr);
                    playbackStatus.textContent = 'Gagal memproses rekaman. Coba rekam ulang.';
                });
            };
        }

        // Jalankan rekaman
        btnStart.addEventListener('click', () => {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            stopActivePlayback();
            mediaRecorder.start();
            statusTag.textContent = 'Merekam...';
            statusTag.classList.add('recording');
            btnStart.style.display = 'none';
            btnStop.style.display = 'flex';
            effectsPanel.style.display = 'none';

            drawActiveVisualizer(); // Visualisasi jarum gerak pas rekam
        });

        // Stop rekaman
        btnStop.addEventListener('click', () => {
            mediaRecorder.stop();
            statusTag.textContent = 'Selesai merekam!';
            statusTag.classList.remove('recording');
            btnStop.style.display = 'none';
            btnStart.style.display = 'flex';
            cancelAnimationFrame(animationFrameId);
            drawIdleVisualizer();
        });

        // Gambar Visualizer Jarum Aktif
        function drawActiveVisualizer() {
            animationFrameId = requestAnimationFrame(drawActiveVisualizer);
            analyser.getByteFrequencyData(dataArray);

            const width = canvas.width;
            const height = canvas.height;
            canvasCtx.clearRect(0, 0, width, height);

            const barWidth = (width / bufferLength) * 1.4;
            let x = 0;

            for (let i = 0; i < bufferLength; i++) {
                // Konfigurasi tinggi jarum
                let barHeight = (dataArray[i] / 255) * (height * 0.85);
                if (barHeight < 6) barHeight = 6; 

                canvasCtx.fillStyle = '#2ecc71'; // Warna ijo pas rekam
                
                const y = (height - barHeight) / 2;
                canvasCtx.beginPath();
                canvasCtx.roundRect(x, y, barWidth - 4, barHeight, 6);
                canvasCtx.fill();

                x += barWidth;
            }
        }

        // Gambar Jarum Statis (Diem)
        function drawIdleVisualizer() {
            const width = canvas.width;
            const height = canvas.height;
            canvasCtx.clearRect(0, 0, width, height);

            const barWidth = (width / bufferLength) * 1.4;
            let x = 0;

            for (let i = 0; i < bufferLength; i++) {
                const barHeight = 6; 
                const y = (height - barHeight) / 2;
                canvasCtx.fillStyle = '#cbd5e1'; 
                canvasCtx.beginPath();
                canvasCtx.roundRect(x, y, barWidth - 4, barHeight, 6);
                canvasCtx.fill();
                x += barWidth;
            }
        }

        // --- MANIPULASI EFEK AUDIO & REVERSE ---
        function applyEffect(effectType) {
            if (!originalAudioBuffer) return;
            activeEffect = effectType;

            // Buat buffer salinan baru agar audio original tidak rusak
            const numChannels = originalAudioBuffer.numberOfChannels;
            const length = originalAudioBuffer.length;
            const sampleRate = originalAudioBuffer.sampleRate;
            processedAudioBuffer = audioCtx.createBuffer(numChannels, length, sampleRate);

            // Copy data original ke buffer proses
            for (let channel = 0; channel < numChannels; channel++) {
                const channelData = originalAudioBuffer.getChannelData(channel);
                const destData = processedAudioBuffer.getChannelData(channel);
                destData.set(channelData);
            }

            // Jika efeknya REVERSE (Putar balik)
            if (effectType === 'reverse') {
                for (let channel = 0; channel < numChannels; channel++) {
                    const destData = processedAudioBuffer.getChannelData(channel);
                    Array.prototype.reverse.call(destData); // Balikin urutan array audio
                }
            }
            
            stopActivePlayback();
            playbackStatus.textContent = `Efek: ${effectType.toUpperCase()} siap!`;
        }

        // Handler Pilihan Efek
        effectButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                effectButtons.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                applyEffect(btn.dataset.effect);
            });
        });

        // Play / Pause Audio Bermanipulasi
        btnPlayPause.addEventListener('click', () => {
            if (isPlaying) {
                stopActivePlayback();
            } else {
                playProcessedAudio();
            }
        });

        function playProcessedAudio() {
            if (!processedAudioBuffer) return;

            // Buat node sumber suara dari buffer yang udah dikasih efek
            currentSourceNode = audioCtx.createBufferSource();
            currentSourceNode.buffer = processedAudioBuffer;

            // Berikan efek pitch shifting pake playbackRate
            if (activeEffect === 'chipmunk') {
                currentSourceNode.playbackRate.value = 1.6; // Suara cepat & tinggi
            } else if (activeEffect === 'deep') {
                currentSourceNode.playbackRate.value = 0.75; // Suara lambat & berat
            } else {
                currentSourceNode.playbackRate.value = 1.0; 
            }

            // Sambungkan ke output suara laptop/HP
            currentSourceNode.connect(audioCtx.destination);
            
            // Juga sambungin ke analyser biar jarumnya gerak pas diputar ulang!
            currentSourceNode.connect(analyser);

            currentSourceNode.start(0);
            isPlaying = true;
            togglePlayUI(true);
            playbackStatus.textContent = 'Memutar suara...';
            
            drawActiveVisualizer(); // Hidupkan visualizer jarum pas putar ulang

            currentSourceNode.onended = () => {
                stopActivePlayback();
            };
        }

        function stopActivePlayback() {
            if (currentSourceNode) {
                try {
                    currentSourceNode.stop();
                } catch(e) {}
                currentSourceNode.disconnect();
                currentSourceNode = null;
            }
            isPlaying = false;
            togglePlayUI(false);
            playbackStatus.textContent = 'Putaran berhenti.';
            cancelAnimationFrame(animationFrameId);
            drawIdleVisualizer();
        }

        function togglePlayUI(playing) {
            if (playing) {
                playIcon.style.display = 'none';
                pauseIcon.style.display = 'block';
            } else {
                playIcon.style.display = 'block';
                pauseIcon.style.display = 'none';
            }
        }

        // --- EXPORT KE WAV & DOWNLOAD OTOMATIS ---
        btnDownload.addEventListener('click', () => {
            if (!processedAudioBuffer) return;
            
            playbackStatus.textContent = 'Memproses berkas...';
            
            // Konversi AudioBuffer ke file WAV murni di sisi klien
            const wavBlob = audioBufferToWav(processedAudioBuffer, activeEffect);
            const url = URL.createObjectURL(wavBlob);
            
            // Bikin tag anchor bayangan buat download otomatis
            const anchor = document.createElement('a');
            anchor.style.display = 'none';
            anchor.href = url;
            anchor.download = `rekaman_${activeEffect}_${Date.now()}.wav`;
            document.body.appendChild(anchor);
            anchor.click();
            
            setTimeout(() => {
                document.body.removeChild(anchor);
                window.URL.revokeObjectURL(url);
                playbackStatus.textContent = 'Berhasil disimpan ke memori!';
            }, 100);
        });

        // Helper: Pembuat file WAV dari AudioBuffer (Standard WAV PCM encoder)
        function audioBufferToWav(buffer, effect) {
            let numOfChan = buffer.numberOfChannels,
                sampleRate = buffer.sampleRate,
                format = 1, // 1 = PCM raw
                bitDepth = 16;
            
            // Atur sampleRate menyesuaikan efek suara agar file download sama persis dengan yang didengar
            if (effect === 'chipmunk') {
                sampleRate = Math.floor(sampleRate * 1.6);
            } else if (effect === 'deep') {
                sampleRate = Math.floor(sampleRate * 0.75);
            }

            let result;
            if (numOfChan === 2) {
                result = interleave(buffer.getChannelData(0), buffer.getChannelData(1));
            } else {
                result = buffer.getChannelData(0);
            }

            return writeWavFile(result, numOfChan, sampleRate, format, bitDepth);
        }

        function interleave(inputL, inputR) {
            let length = inputL.length + inputR.length;
            let result = new Float32Array(length);
            let index = 0, inputIndex = 0;
            while (index < length) {
                result[index++] = inputL[inputIndex];
                result[index++] = inputR[inputIndex];
                inputIndex++;
            }
            return result;
        }

        function writeWavFile(samples, numChannels, sampleRate, format, bitDepth) {
            let buffer = new ArrayBuffer(44 + samples.length * 2);
            let view = new DataView(buffer);

            /* RIFF identifier */
            writeString(view, 0, 'RIFF');
            /* file length */
            view.setUint32(4, 36 + samples.length * 2, true);
            /* RIFF type */
            writeString(view, 8, 'WAVE');
            /* format chunk identifier */
            writeString(view, 12, 'fmt ');
            /* format chunk length */
            view.setUint32(16, 16, true);
            /* sample format (raw) */
            view.setUint16(20, format, true);
            /* channel count */
            view.setUint16(22, numChannels, true);
            /* sample rate */
            view.setUint32(24, sampleRate, true);
            /* byte rate (sample rate * block align) */
            view.setUint32(28, sampleRate * numChannels * (bitDepth / 8), true);
            /* block align (channel count * bytes per sample) */
            view.setUint16(32, numChannels * (bitDepth / 8), true);
            /* bits per sample */
            view.setUint16(34, bitDepth, true);
            /* data chunk identifier */
            writeString(view, 36, 'data');
            /* data chunk length */
            view.setUint32(40, samples.length * 2, true);

            floatTo16BitPCM(view, 44, samples);

            return new Blob([view], { type: 'audio/wav' });
        }

        function floatTo16BitPCM(output, offset, input) {
            for (let i = 0; i < input.length; i++, offset += 2) {
                let s = Math.max(-1, Math.min(1, input[i]));
                output.setInt16(offset, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
            }
        }

        function writeString(view, offset, string) {
            for (let i = 0; i < string.length; i++) {
                view.setUint8(offset + i, string.charCodeAt(i));
            }
        }
    </script>
</body>
</html>
