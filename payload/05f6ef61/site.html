<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#000000">
<title>Gemini</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#000; --surface:#1c1c1e; --surface2:#0b0b0c; --line:#2a2a2d; --ink:#e8e8ec; --soft:#c4c4cc; --mute:#858590; --err:#ff8f86;
  font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink)}
body{font-size:13.5px;line-height:1.6;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
:focus-visible{outline:2px solid var(--c);outline-offset:2px}
.logo{display:block}
.app{height:100dvh;max-width:640px;margin:0 auto;display:flex;flex-direction:column}

/* bar atas */
.top{display:flex;align-items:center;gap:8px;padding:max(10px,env(safe-area-inset-top)) 14px 6px}
.round{width:32px;height:32px;border-radius:50%;background:var(--surface);display:grid;place-items:center;flex:none;border:1px solid var(--line)}
.round svg{width:15px;height:15px;stroke:var(--soft);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.pill{display:flex;align-items:center;gap:7px;height:32px;padding:0 11px 0 10px;border-radius:16px;background:var(--surface);border:1px solid var(--line);font-size:12.5px;font-weight:500}
.pill .logo{width:14px;height:14px}
.pill .chev{width:11px;height:11px;stroke:var(--mute);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.spacer{flex:1}

/* percakapan */
.thread{flex:1;overflow-y:auto;padding:2px 14px 10px;overscroll-behavior:contain;scroll-behavior:smooth}
.msg{margin:16px 0}
.msg.user{display:flex;justify-content:flex-end}
.msg.user .bubble{background:var(--surface);border:1px solid var(--line);padding:7px 12px;border-radius:15px 15px 4px 15px;max-width:82%;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.ai{display:grid;grid-template-columns:22px 1fr;gap:9px}
.avatar{width:22px;height:22px;border-radius:50%;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;margin-top:1px}
.avatar .logo{width:12px;height:12px}
.who{font-size:11.5px;color:var(--mute);margin-bottom:3px}
.who b{color:var(--soft);font-weight:500}
.text{overflow-wrap:anywhere;white-space:pre-wrap;color:var(--ink)}
.text.err{color:var(--err)}
.text code{font:12px ui-monospace,Menlo,monospace;background:var(--surface2);border:1px solid var(--line);border-radius:5px;padding:1px 5px}
.text pre{background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:11px 13px;overflow-x:auto;margin:8px 0;white-space:pre}
.text pre code{background:none;border:0;padding:0}
.foot{margin-top:6px;font-size:12px}
.foot button{color:var(--mute)}.foot button:hover{color:var(--ink)}
.dots{display:inline-flex;gap:5px;padding:7px 0}
.dots b{width:6px;height:6px;border-radius:50%;background:var(--mute)}
@media (prefers-reduced-motion:no-preference){
  .dots b{animation:p 1.1s infinite ease-in-out}.dots b:nth-child(2){animation-delay:.15s}.dots b:nth-child(3){animation-delay:.3s}
  @keyframes p{0%,80%,100%{opacity:.25}40%{opacity:1}}
  .drawer{transition:transform .26s cubic-bezier(.3,.8,.3,1)}.scrim{transition:opacity .26s}
}

/* kolom ketik */
.dock{padding:6px 14px max(12px,env(safe-area-inset-bottom))}
.composer{display:flex;align-items:flex-end;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:3px 3px 3px 13px;transition:border-color .15s}
.composer:focus-within{border-color:color-mix(in srgb,var(--c) 55%,var(--line))}
.composer textarea{flex:1;resize:none;border:0;outline:0;background:none;color:var(--ink);font:inherit;font-size:13.5px;padding:7px 0;max-height:130px;min-height:32px;line-height:1.45}
.composer textarea::placeholder{color:var(--mute)}
.send{width:30px;height:30px;border-radius:50%;background:var(--btn);display:grid;place-items:center;flex:none;margin:1px}
.send svg{width:14px;height:14px;stroke:#fff;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.send:disabled{background:#2a2a2d;cursor:default}.send:disabled svg{stroke:#6d6d77}

/* panel model */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);opacity:0;pointer-events:none;z-index:10}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;bottom:0;left:0;width:min(76vw,260px);background:var(--surface2);border-right:1px solid var(--line);z-index:11;transform:translateX(-102%);visibility:hidden;padding:max(18px,env(safe-area-inset-top)) 10px 18px;overflow-y:auto}
.drawer.on{transform:none;visibility:visible}
.drawer h2{font-size:12px;font-weight:500;color:var(--mute);margin:6px 10px 10px}
.opt{display:flex;align-items:center;gap:11px;padding:8px 10px;width:100%;text-align:left;border-radius:12px}
.opt:hover{background:var(--surface)}
.opt[aria-checked=true]{background:var(--surface);box-shadow:inset 0 0 0 1px var(--line)}
.opt .tile{width:30px;height:30px;border-radius:9px;background:var(--bg);border:1px solid var(--line);display:grid;place-items:center;flex:none}
.opt .tile .logo{width:16px;height:16px}
.opt span.t{flex:1;font-weight:500;font-size:13px}
.opt small{display:block;color:var(--mute);font-size:11.5px;font-weight:400}
.hh{display:flex;justify-content:space-between;align-items:center;margin-top:22px !important}
.hh button{font-size:11.5px;color:var(--mute)}.hh button:hover{color:var(--ink)}
.hitem{display:flex;align-items:center;gap:6px;border-radius:10px}
.hitem:hover,.hitem.cur{background:var(--surface)}
.hitem .go{flex:1;min-width:0;display:flex;align-items:center;gap:10px;padding:8px 6px 8px 10px;text-align:left}
.hitem .go .logo{width:14px;height:14px;flex:none}
.hitem .tt{flex:1;min-width:0}
.hitem .tt b{display:block;font-weight:400;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hitem .tt small{color:var(--mute);font-size:11px}
.hitem .del{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;flex:none;margin-right:4px}
.hitem .del svg{width:13px;height:13px;stroke:var(--mute);fill:none;stroke-width:2;stroke-linecap:round}
.hitem .del:hover svg{stroke:var(--err)}
.hempty{color:var(--mute);font-size:12.5px;padding:4px 10px}
.opt .ck{width:14px;height:14px;stroke:var(--ink);fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.opt[aria-checked=true] .ck{opacity:1}

/* pemilih model di kolom ketik */
.dock{position:relative}
.composer{flex-direction:column;align-items:stretch;gap:4px;padding:10px 8px 8px 14px;border-radius:20px}
.composer textarea{flex:none;width:100%;padding:0;min-height:26px}
.cbar{display:flex;align-items:center;justify-content:space-between;gap:8px}
.chip{display:flex;align-items:center;gap:7px;height:30px;padding:0 10px 0 9px;border-radius:15px;background:var(--surface2);border:1px solid var(--line);font-size:12.5px;font-weight:500;max-width:70%}
.chip:hover{border-color:color-mix(in srgb,var(--c) 45%,var(--line))}
.chip .logo{width:14px;height:14px;flex:none}
.chip span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip .chev{width:11px;height:11px;stroke:var(--mute);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* lembar pemilihan model */
.scrim2{position:fixed;inset:0;background:rgba(0,0,0,.6);opacity:0;pointer-events:none;z-index:20}
.scrim2.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:640px;margin:0 auto;max-height:88dvh;background:#141416;border:1px solid var(--line);border-bottom:0;border-radius:26px 26px 0 0;z-index:21;transform:translateY(105%);visibility:hidden;display:flex;flex-direction:column;padding-bottom:max(14px,env(safe-area-inset-bottom))}
.sheet.on{transform:none;visibility:visible}
.shead{display:grid;grid-template-columns:36px 1fr 36px;align-items:center;padding:16px 14px 6px}
.shead h2{margin:0;text-align:center;font-size:15px;font-weight:600}
.shead button{width:32px;height:32px;display:grid;place-items:center;border-radius:50%}
.shead svg{width:18px;height:18px;stroke:var(--ink);fill:none;stroke-width:2;stroke-linecap:round}
.sbody{overflow-y:auto;padding:2px 14px 6px;overscroll-behavior:contain}
.sec{display:flex;align-items:center;gap:8px;margin:16px 4px 8px;font-size:12px;color:var(--mute)}
.sec .logo{width:15px;height:15px;flex:none}.sec b{color:var(--soft);font-weight:500}
.mcard{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--surface);border-radius:14px;padding:12px 14px;margin-bottom:6px;border:1px solid transparent}
.mcard:hover{background:#232326}
.mcard .mt{flex:1;min-width:0}
.mcard .mt b{display:flex;align-items:center;gap:8px;font-weight:500;font-size:15px}
.mcard .mt small{display:block;color:var(--mute);font-size:12.5px;margin-top:2px}
.badge{font-size:10.5px;font-weight:500;padding:2px 9px;border-radius:10px;background:color-mix(in srgb,var(--bc) 18%,transparent);color:var(--bc)}
.mcard .ck{width:20px;height:20px;stroke:var(--bc);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;opacity:0;flex:none}
.mcard[aria-checked=true]{border-color:color-mix(in srgb,var(--bc) 40%,transparent)}
.mcard[aria-checked=true] .ck{opacity:1}
.mcard .tile{width:32px;height:32px;border-radius:10px;background:var(--bg);border:1px solid var(--line);display:grid;place-items:center;flex:none}
.mcard .tile .logo{width:17px;height:17px}
.mcard .nx{width:16px;height:16px;stroke:var(--mute);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.mcard.more{margin-top:14px}
@media (prefers-reduced-motion:no-preference){.sheet{transition:transform .28s cubic-bezier(.3,.8,.3,1)}.scrim2{transition:opacity .28s}}
@media (prefers-reduced-motion:no-preference){body{animation:pageIn .4s ease-out}@keyframes pageIn{from{opacity:0}}}
</style>
</head>

<script>
/* ============ KONFIGURASI ============ */
// Tiap model: alamat API + nama parameter untuk pertanyaan (+ parameter tambahan jika ada).
const APIS = {
  gemini:   { url:"https://api.clutch.web.id/ai/gemini",       q:"prompt", extra:{ apikey:"alip-dw4g0qj6v2lqbb5uv05m" } },
  gpt:      { url:"https://api-cloud.my.id/ai/gpt",            q:"text" },
  claude:   { url:"https://api-cloud.my.id/ai/claude-haiku",   q:"prompt" },
  deepseek: { url:"https://api-cloud.my.id/ai/deepseek",       q:"text" },
};

// Mode jawaban: API-nya sama, yang beda adalah arahan gaya jawaban yang ditempel di depan pertanyaan.
const MODES = [
  { id:"fast",     label:"Cepat",    desc:"Jawaban singkat dan langsung ke inti", pre:"Jawab dengan singkat, padat, dan langsung ke inti (maksimal 3 kalimat). Pertanyaan: " },
  { id:"balanced", label:"Seimbang", desc:"Jawaban standar untuk tugas sehari-hari", badge:"Default", pre:"" },
  { id:"deep",     label:"Mendalam", desc:"Jawaban rinci, langkah demi langkah, dengan contoh", pre:"Jawab secara lengkap dan mendalam: jelaskan langkah demi langkah, beri contoh, dan sebutkan hal yang perlu diperhatikan. Pertanyaan: " },
];
const modeLabel = (v) => (MODES.find(x=>x.id===v)||{}).label||"";
const applyMode = (t,v) => ((MODES.find(x=>x.id===v)||{}).pre||"") + t;

const $ = (s) => document.querySelector(s);
const MODELS = {
  gemini:     { name:"Gemini",     icon:"gemini",   by:"Google",        c:"#7f9bff", btn:"#3d63e0" },
  gpt:        { name:"ChatGPT",    icon:"gpt",      by:"OpenAI",        c:"#19c37d", btn:"#16976a" },
  claude:     { name:"Claude",     icon:"claude",   by:"Anthropic",     c:"#d97757", btn:"#c15f3c" },
  deepseek:   { name:"DeepSeek",   icon:"deepseek", by:"DeepSeek AI",   c:"#4d6bfe", btn:"#3b52d4" },
};
const iconOf = (m) => (MODELS[m]&&MODELS[m].icon)||m;
const logo = (m, cls="logo") => `<svg class="${cls}"><use href="#l-${iconOf(m)}"/></svg>`;
const get = (k,d)=>{ try{ return localStorage.getItem("ai_"+k) ?? d }catch{ return d } };
const set = (k,v)=>{ try{ localStorage.setItem("ai_"+k,v) }catch{} };
const del = (k)=>{ try{ localStorage.removeItem("ai_"+k) }catch{} };

/* ---------- satu riwayat untuk semua model ---------- */
const parse = (k) => { try{ return JSON.parse(get(k,"[]")) || [] }catch{ return [] } };
const loadAll = () => parse("chats_all");
const saveAll = (l) => set("chats_all", JSON.stringify(l.slice(0,100)));
(function migrate(){ // gabungkan riwayat per-model dari versi sebelumnya
  const found=[];
  for(const m of Object.keys(MODELS)){
    const l=parse("chats_"+m);
    if(l.length){ l.forEach(c=>c.msgs.forEach(x=>{ if(x.r==="a"&&!x.m) x.m=m })); found.push(...l); }
    del("chats_"+m);
  }
  const old=parse("chats"); if(old.length) found.push(...old); del("chats");
  if(!found.length) return;
  const all=loadAll(), ids=new Set(all.map(c=>c.id));
  saveAll([...all,...found.filter(c=>!ids.has(c.id))].sort((a,b)=>b.ts-a.ts));
})();

const S = { model: MODELS[get("model","")] ? get("model","") : "gemini", mode: MODES.some(x=>x.id===get("mode","")) ? get("mode","") : "balanced", chat:null, busy:false };
let chats = loadAll();

/* ---------- model aktif ---------- */
function paint(){
  const M=MODELS[S.model], app=$("#app");
  app.style.setProperty("--c",M.c); app.style.setProperty("--btn",M.btn);
  document.documentElement.style.setProperty("--c",M.c);
  document.title=M.name;
  $("#pillName").textContent=M.name; $("#pillLogo").setAttribute("href","#l-"+iconOf(S.model));
  $("#chipName").textContent=modeLabel(S.mode);
  $("#input").placeholder="Tanya "+M.name;
  renderSheet();
}
/* lembar pilihan: dari chip kolom ketik = mode jawaban, dari pill atas = ganti AI */
let sheetView="modes";
const CK='<svg class="ck" viewBox="0 0 24 24"><path d="M5 12.500l4.500 4.500L19 7.500"/></svg>';
function renderSheet(){
  const M=MODELS[S.model], body=$("#sbody");
  $("#sttl").textContent = sheetView==="ais" ? "Pilih AI" : "Mode jawaban";
  body.scrollTop=0;
  if(sheetView==="modes"){
    body.style.setProperty("--bc",M.c);
    body.innerHTML = MODES.map(m=>`<button class="mcard" role="radio" aria-checked="${m.id===S.mode}" data-v="${m.id}"><span class="mt"><b>${m.label}${m.badge?`<span class="badge">${m.badge}</span>`:""}</b><small>${m.desc}</small></span>${CK}</button>`).join("");
    body.querySelectorAll("[data-v]").forEach(b=>b.onclick=()=>{ S.mode=b.dataset.v; set("mode",S.mode); paint(); menu(false); });
  }else{
    body.innerHTML = Object.entries(MODELS).map(([k,A])=>`<button class="mcard" role="radio" aria-checked="${k===S.model}" data-m="${k}" style="--bc:${A.c}"><span class="tile">${logo(k)}</span><span class="mt"><b>${A.name}</b><small>${A.by}</small></span>${CK}</button>`).join("");
    body.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{ S.model=b.dataset.m; set("model",S.model); paint(); menu(false); });
  }
}
function menu(open,view){
  if(open){ sheetView=view||"modes"; renderSheet(); }
  $("#sheet").classList.toggle("on",open); $("#scrim2").classList.toggle("on",open);
  $("#sheet").setAttribute("aria-hidden",!open); $("#chip").setAttribute("aria-expanded",open&&sheetView==="modes");
}
$("#chip").onclick=()=>menu(true,"modes");
$("#scrim2").onclick=()=>menu(false); $("#sclose").onclick=()=>menu(false);

function drawer(open){
  $("#drawer").classList.toggle("on",open); $("#scrim").classList.toggle("on",open);
  $("#drawer").setAttribute("aria-hidden",!open);
  if(open) $("#drawer .opt[aria-checked=true]")?.focus(); else $("#histBtn").focus();
}
$("#histBtn").onclick=()=>drawer(true); $("#pill").onclick=()=>menu(true,"ais");
$("#scrim").onclick=()=>drawer(false);
addEventListener("keydown",e=>{ if(e.key==="Escape"){ drawer(false); menu(false) } });

/* ---------- render pesan ---------- */
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function md(t){
  return t.split(/```[a-z]*\n?([\s\S]*?)```/g).map((p,i)=> i%2
    ? `<pre><code>${esc(p.replace(/\n$/,""))}</code></pre>`
    : esc(p).replace(/`([^`\n]+)`/g,"<code>$1</code>").replace(/\*\*([^*\n]+)\*\*/g,"<strong>$1</strong>")).join("");
}
const scroll=()=>{ const t=$("#thread"); t.scrollTop=t.scrollHeight };
function addUser(text){
  const d=document.createElement("div"); d.className="msg user"; d.innerHTML='<div class="bubble"></div>';
  d.firstChild.textContent=text; $("#thread").append(d); scroll();
}
function addAI(m,v){
  const d=document.createElement("div"); d.className="msg ai"; d.style.setProperty("--c",MODELS[m].c);
  d.innerHTML=`<div class="avatar">${logo(m)}</div><div><div class="who"><b>${MODELS[m].name}</b>${modeLabel(v)?" · "+modeLabel(v):""}</div><div class="text"><span class="dots" role="status" aria-label="Memproses"><b></b><b></b><b></b></span></div></div>`;
  $("#thread").append(d); scroll(); return d;
}
function finish(el,r){
  const t=el.querySelector(".text");
  if(r.ok){
    const body=r.text||"Respons diterima, tetapi teks jawaban tidak ditemukan.";
    t.innerHTML=md(body);
    if(r.ms) el.querySelector(".who").insertAdjacentHTML("beforeend",` · ${(r.ms/1000).toFixed(1)} dtk`);
    const f=document.createElement("div"); f.className="foot"; f.innerHTML="<button>Salin</button>";
    f.firstChild.onclick=async e=>{ try{ await navigator.clipboard.writeText(body); e.target.textContent="Tersalin"; setTimeout(()=>e.target.textContent="Salin",1500) }catch{} };
    t.parentNode.append(f);
  }else{ t.classList.add("err"); t.textContent=r.error }
  scroll();
}

/* ---------- riwayat ---------- */
const lastModel = (c) => ([...c.msgs].reverse().find(m=>m.r==="a")||{}).m || S.model;
function whenLabel(ts){
  const d=new Date(ts), n=new Date();
  return d.toDateString()===n.toDateString()
    ? d.toLocaleTimeString("id-ID",{hour:"2-digit",minute:"2-digit"})
    : d.toLocaleDateString("id-ID",{day:"numeric",month:"short"});
}
function renderHist(){
  const box=$("#hist");
  $("#clearAll").style.display = chats.length ? "" : "none";
  if(!chats.length){ box.innerHTML='<div class="hempty">Belum ada riwayat.</div>'; return; }
  box.replaceChildren(...chats.map(c=>{
    const d=document.createElement("div"); d.className="hitem"+(S.chat&&S.chat.id===c.id?" cur":"");
    d.innerHTML=`<button class="go">${logo(MODELS[lastModel(c)]?lastModel(c):"gemini")}<span class="tt"><b></b><small>${whenLabel(c.ts)}</small></span></button><button class="del" aria-label="Hapus chat"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>`;
    d.querySelector("b").textContent=c.title;
    d.querySelector(".go").onclick=()=>openChat(c.id);
    d.querySelector(".del").onclick=()=>removeChat(c.id);
    return d;
  }));
}
function openChat(id){
  if(S.busy) return;
  const c=chats.find(x=>x.id===id); if(!c) return;
  S.chat=c; $("#thread").replaceChildren();
  for(const m of c.msgs){
    if(m.r==="u") addUser(m.t);
    else finish(addAI(MODELS[m.m]?m.m:"gemini",m.v), m.ok ? {ok:true,ms:m.ms,text:m.t} : {ok:false,error:m.t});
  }
  S.model=lastModel(c); set("model",S.model); paint();
  renderHist(); drawer(false); scroll();
}
function removeChat(id){
  if(S.busy) return;
  chats=chats.filter(x=>x.id!==id); saveAll(chats);
  if(S.chat&&S.chat.id===id){ S.chat=null; $("#thread").replaceChildren(); }
  renderHist();
}
$("#clearAll").onclick=()=>{ if(S.busy) return; chats=[]; saveAll(chats); S.chat=null; $("#thread").replaceChildren(); renderHist(); };

/* ---------- pertanyaan tentang pembuat ---------- */
const CREATOR_ANSWER = "Saya dibuat oleh Mohammad Jamaluddin.";
function askedAboutCreator(t){
  t=t.toLowerCase();
  const q=/\b(siapa|who|dibuat|made|created|built)\b/.test(t);
  const act=/(membuat|buat|bikin|membikin|menciptakan|pencipta|pembuat|pengembang|mengembangkan|developer|dibuat|diciptakan|created|made|built|develop|creator|owner|pemilik|programmer)/.test(t);
  const self=/(\bkamu\b|\banda\b|\bkau\b|\blu\b|\bmu\b|\w+mu\b|\byou\b|\byour\b|\bini\b|aplikasi|\bapp\b|\bbot\b|\bai\b|website|situs)/.test(t);
  return t.length<140 && q && act && self;
}

/* ---------- panggilan API ---------- */
function pickText(d){
  if(typeof d==="string")return d; if(!d||typeof d!=="object")return "";
  for(const k of ["answer","text","response","reply","content","result","output","message","msg"]) if(typeof d[k]==="string"&&d[k].trim())return d[k];
  for(const k of ["data","result","response","answer"]) if(d[k]&&typeof d[k]==="object"){ const t=pickText(d[k]); if(t)return t }
  return "";
}
// Jalur panggilan: langsung ke API dulu. Kalau diblokir browser (CORS), coba lewat proxy publik.
const ROUTES = [
  { name:"langsung" },
  { name:"corsproxy.io", wrap:(u)=>"https://corsproxy.io/?url="+encodeURIComponent(u) },
];
let routeStart = 0; // ingat jalur yang terakhir berhasil

function targetUrl(model,prompt){
  const A=APIS[model], u=new URL(A.url);
  for(const [k,v] of Object.entries(A.extra||{})) u.searchParams.set(k,v);
  u.searchParams.set(A.q,prompt);
  return u.toString();
}
async function ask(model,prompt){
  const t0=performance.now(), notes=[];
  for(let n=0;n<ROUTES.length;n++){
    const i=(routeStart+n)%ROUTES.length, R=ROUTES[i];
    try{
      const t=targetUrl(model,prompt);
      const r=await fetch(R.wrap?R.wrap(t):t,{signal:AbortSignal.timeout(90000)});
      const raw=await r.text(); let j; try{ j=JSON.parse(raw) }catch{ j=raw }
      const ms=Math.round(performance.now()-t0);
      const detail=String((j&&(j.detail||j.error||j.message))||(typeof j==="string"?j.slice(0,160):"")||r.statusText||"");
      if(r.ok){ routeStart=i; return {ok:true,ms,text:pickText(j)} }
      // respons error dari server API sendiri: jangan ganti jalur
      if(!R.wrap || ![403,407,429,502,503].includes(r.status)) return {ok:false,ms,error:`Server membalas ${r.status}. ${detail}`};
      notes.push(`${R.name}: ${r.status}`);
    }catch(e){
      if(e.name==="TimeoutError") return {ok:false,error:"Waktu habis setelah 90 detik."};
      notes.push(`${R.name}: diblokir/terputus`);
    }
  }
  return {ok:false,error:`Permintaan gagal lewat semua jalur (${notes.join("; ")}). Kemungkinan API tidak mengizinkan akses dari browser (CORS) atau sedang down. Coba lagi sebentar.`};
}

/* ---------- kirim ---------- */
async function send(){
  const text=$("#input").value.trim(); if(!text||S.busy) return;
  S.busy=true; $("#input").value=""; grow(); sync();
  const model=S.model, mode=S.mode;
  if(!S.chat){ S.chat={id:Date.now().toString(36),title:text.slice(0,60),ts:Date.now(),msgs:[]}; }
  const chat=S.chat;
  chat.msgs.push({r:"u",t:text});
  addUser(text); const el=addAI(model,mode);
  let res;
  if(askedAboutCreator(text)){ await new Promise(r=>setTimeout(r,450)); res={ok:true,text:CREATOR_ANSWER}; }
  else res=await ask(model,applyMode(text,mode));
  finish(el,res);
  chat.msgs.push({r:"a",m:model,v:mode,ok:!!res.ok,t:res.ok?(res.text||""):res.error,ms:res.ms||0});
  chat.ts=Date.now();
  chats=[chat,...chats.filter(c=>c.id!==chat.id)]; saveAll(chats); renderHist();
  S.busy=false; sync();
}
const sync=()=>{ $("#send").disabled=S.busy||!$("#input").value.trim() };
function grow(){ const i=$("#input"); i.style.height="auto"; i.style.height=Math.min(i.scrollHeight,130)+"px" }
$("#input").addEventListener("input",()=>{ grow(); sync() });
$("#input").addEventListener("keydown",e=>{ if(e.key==="Enter"&&!e.shiftKey&&matchMedia("(hover:hover)").matches){ e.preventDefault(); send() } });
$("#send").onclick=send;
$("#newchat").onclick=()=>{ if(S.busy) return; S.chat=null; $("#thread").replaceChildren(); renderHist(); $("#input").focus() };

paint(); renderHist();
</script>
</body>
</html>
