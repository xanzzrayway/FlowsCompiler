<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel Kontrol</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif;}
body{background:#111;color:#fff;min-height:100vh;}
.login{display:flex;align-items:center;justify-content:center;min-height:100vh;}
.kotak{background:#222;padding:30px;border-radius:12px;width:90%;max-width:400px;}
h2{text-align:center;margin-bottom:20px;color:#0f8}
input{width:100%;padding:14px;margin:8px 0;border:none;border-radius:8px;background:#333;color:#fff;font-size:16px}
button{width:100%;padding:14px;border:none;border-radius:8px;background:#0f8;color:#000;font-weight:bold;font-size:16px;cursor:pointer;margin-top:5px}
button.merah{background:red;color:#fff}
.panel{display:none;padding:20px;max-width:450px;margin:0 auto}
.item{display:flex;justify-content:space-between;align-items:center;padding:15px 0;border-bottom:1px solid #333}
.tombol{width:54px;height:28px;background:#444;border-radius:14px;position:relative;cursor:pointer}
.tombol.aktif{background:#0f8}
.tombol::after{content:'';position:absolute;width:22px;height:22px;background:#fff;border-radius:50%;top:3px;left:3px;transition:.2s}
.tombol.aktif::after{left:29px}
.layar-kunci{position:fixed;inset:0;background:#000;z-index:99999;display:none;flex-direction:column;align-items:center;justify-content:center}
.teks{color:red;font-size:30px;font-weight:bold;margin-bottom:30px;text-align:center}
.pin-input{padding:15px;font-size:24px;text-align:center;letter-spacing:8px;width:200px}
.salah{color:red;margin-top:15px;display:none}
.berkedip{animation:kedip .4s infinite}
@keyframes kedip{0%{background:#111}50%{background:#ffd}100%{background:#111}}
.kabur{filter:blur(4px)}
.sembunyi{display:none!important}
</style>
</head>
<body id="bd">

<div class="login" id="hal-login">
  <div class="kotak">
    <h2>🔐 LOGIN</h2>
    <input type="text" id="user" placeholder="Username">
    <input type="password" id="pass" placeholder="Password">
    <button onclick="masuk()">MASUK</button>
  </div>
</div>

<div class="panel" id="hal-panel">
  <h2>⚙️ PANEL</h2>
  <div class="item"><span>1. Senter Berkedip</span><div class="tombol" id="f1" onclick="ganti(this,1)"></div></div>
  <div class="item"><span>2. Kunci HP (PIN:2927)</span><div class="tombol" id="f2" onclick="kunci()"></div></div>
  <div class="item"><span>3. Suara Alarm</span><div class="tombol" id="f3" onclick="ganti(this,3)"></div></div>
  <div class="item"><span>4. Efek Kabur</span><div class="tombol" id="f4" onclick="ganti(this,4)"></div></div>
  <div class="item"><span>5. Tulisan Kunci</span><div class="tombol" id="f5" onclick="ganti(this,5)"></div></div>
  <button class="merah" onclick="keluar()">KELUAR</button>
</div>

<div class="layar-kunci" id="layar">
  <div class="teks" id="teks-kunci">HP ANDA TERKENA LOCK</div>
  <input type="password" class="pin-input" id="pin" placeholder="PIN" maxlength="4">
  <button onclick="bukaKunci()">BUKA</button>
  <p class="salah" id="pin-salah">PIN SALAH!</p>
</div>

<audio id="suara" loop preload="auto">
  <source src="https://assets.mixkit.co/sfx/download/mixkit-emergency-alarm-beep-warning-638.mp3" type="audio/mpeg">
</audio>

<script>
const U_NAMA="ZXC", U_KATA="121", PIN_BENAR="2927";
let nyala={f1:0,f3:0,f4:0,f5:0};
const suara=document.getElementById("suara"); suara.volume=1;

function masuk(){
  let u=document.getElementById("user").value,p=document.getElementById("pass").value;
  if(u===U_NAMA&&p===U_KATA){
    document.getElementById("hal-login").classList.add("sembunyi");
    document.getElementById("hal-panel").style.display="block";
  }else alert("Salah!");
}
function ganti(el,nomor){
  el.classList.toggle("aktif");
  nyala["f"+nomor]=nyala["f"+nomor]?0:1;
  terapkan();
}
function kunci(){
  document.getElementById("f2").classList.add("aktif");
  nyala.f3=1;nyala.f5=1;
  document.getElementById("f3").classList.add("aktif");
  document.getElementById("f5").classList.add("aktif");
  document.getElementById("layar").style.display="flex";
  suara.currentTime=0;
  suara.play().catch(()=>{});
  terapkan();
}
function bukaKunci(){
  let pin=document.getElementById("pin").value;
  if(pin===PIN_BENAR){
    document.getElementById("layar").style.display="none";
    document.getElementById("pin").value="";
    document.getElementById("pin-salah").style.display="none";
    nyala.f3=0;nyala.f5=0;
    document.getElementById("f2").classList.remove("aktif");
    document.getElementById("f3").classList.remove("aktif");
    document.getElementById("f5").classList.remove("aktif");
    suara.pause();terapkan();
  }else{
    document.getElementById("pin-salah").style.display="block";
    document.getElementById("pin").value="";
  }
}
function terapkan(){
  let b=document.getElementById("bd");
  nyala.f1?b.classList.add("berkedip"):b.classList.remove("berkedip");
  nyala.f3?suara.play().catch(()=>{}):suara.pause();
  nyala.f4?b.classList.add("kabur"):b.classList.remove("kabur");
}
function keluar(){
  document.getElementById("hal-panel").style.display="none";
  document.getElementById("hal-login").classList.remove("sembunyi");
  document.getElementById("user").value="";
  document.getElementById("pass").value="";
  nyala={f1:0,f3:0,f4:0,f5:0};
  document.querySelectorAll(".tombol").forEach(t=>t.classList.remove("aktif"));
  suara.pause();
}
</script>
</body>
</html>
