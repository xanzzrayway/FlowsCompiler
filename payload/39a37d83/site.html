<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Toy Chica</title>
<style>
:root{--bg:#fff7d6;--card:#fff;--tx:#3a2a00;--ac:#f5b800;--pk:#e8559a;--mut:#8a6d00;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1630;--card:#2a2347;--tx:#fff3c4;--ac:#ffd23f;--pk:#ff7ab8;--mut:#c9b86a}}
:root[data-theme="dark"]{--bg:#1b1630;--card:#2a2347;--tx:#fff3c4;--ac:#ffd23f;--pk:#ff7ab8;--mut:#c9b86a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Noto Sans Thai",sans-serif}
header{text-align:center;padding:20px 16px 8px}
header img{width:100%;max-width:420px;border-radius:20px;border:4px solid var(--ac);display:block;margin:0 auto}
h1{margin:14px 0 2px;font-size:2.2rem;color:var(--pk)}
p.s{margin:0;color:var(--mut)}
main{max-width:720px;margin:0 auto;padding:16px}
.player{background:var(--card);border-radius:16px;padding:12px;border:2px solid var(--ac)}
video{width:100%;border-radius:10px;background:#000;display:block}
#now{margin:10px 4px 0;font-weight:700}
h2{font-size:1.1rem;margin:20px 4px 8px}
.eps{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
button{font:inherit;cursor:pointer;background:var(--card);color:var(--tx);border:2px solid var(--ac);border-radius:12px;padding:12px 8px}
button.on{background:var(--ac);color:#3a2a00;font-weight:700}
.fs{margin-top:10px;width:100%}
.pfs{position:fixed;inset:0;z-index:99;background:#000;border-radius:0;border:0;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
.pfs video{height:100%;border-radius:0;object-fit:contain}
.pfs #now{display:none}
.pfs .fs{position:fixed;right:12px;top:calc(env(safe-area-inset-top,0px) + 8px);width:auto;z-index:100;opacity:.85}
</style></head><body>
