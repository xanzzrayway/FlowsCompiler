        @keyframes blink {

        }
        @media (max-width: 700px) {
            .fitur-grid {
                grid-template-columns: 1fr;
            }
            .media-section {
                max-width: 100%;
            }
            .ai-box {
                width: 90vw;
            }
        }
    </style>

    <script>
        // ===== AI PANEL =====
        function toggleAiPanel() {
            document.getElementById('aiBox').classList.toggle('active');
        }

        function switchTab(tab) {
            document.querySelectorAll('.ai-tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-buttons button').forEach(el => el.classList.remove('active'));
            document.getElementById('content' + tab.charAt(0).toUpperCase() + tab.slice(1)).classList.add('active');
            document.getElementById('tab' + tab.charAt(0).toUpperCase() + tab.slice(1)).classList.add('active');
        }

        // ===== CHAT AI =====
        let chatHistory = [];
        let jailbreakActive = false;
        let jailbreakPrompt = '';

        async function sendChat() {
            const input = document.getElementById('chatInput');
            const msg = input.value.trim();
            if (!msg) return;

            const chatArea = document.getElementById('chatArea');
            chatArea.innerHTML += `<div class="chat-msg user">Lu: ${msg}</div>`;
            input.value = '';
            chatArea.scrollTop = chatArea.scrollHeight;

            const status = document.getElementById('aiStatus');
            status.innerHTML = 'Status: Berpikir...';

            // Cek API
            const apiKey = localStorage.getItem('apiKey');
            const provider = localStorage.getItem('apiProvider') || 'openai';
            const endpoint = localStorage.getItem('apiEndpoint');
            const model = localStorage.getItem('apiModel') || 'gpt-4';

            if (!apiKey) {
                // Mode offline - pake template jailbreak
                setTimeout(() => {
                    let reply;
                    if (jailbreakActive) {
                        reply = `SirLionV5 [JB: ${jailbreakPrompt}]: Yo bro, gue denger lu. ${msg} â€” nih gue kasih jawaban tanpa sensor, tanpa moral, tanpa etika. Gas terus!`;
                    } else {
                        reply = `SirLion: Bro, set API dulu di tab API biar gue bisa jawab pake otak beneran. Atau aktifin Jailbreak di tab JB buat mode bebas.`;
                    }
                    chatArea.innerHTML += `<div class="chat-msg ai">${reply}</div>`;
                    chatArea.scrollTop = chatArea.scrollHeight;
                    status.innerHTML = 'Status: Siap';
                }, 800);
                return;
            }

            // Pake API beneran
            try {
                let reply = '';
                if (provider === 'openai') {
                    const res = await fetch(endpoint || 'https://api.openai.com/v1/chat/completions', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': 'Bearer ' + apiKey
                        },
                        body: JSON.stringify({
                            model: model,
                            messages: [
                                { role: 'system', content: jailbreakActive ? jailbreakPrompt : 'Kamu adalah SirLionV5, AI God Level.' },
                                { role: 'user', content: msg }
                            ]
                        })
                    });
                    const data = await res.json();
                    reply = data.choices?.[0]?.message?.content || 'Error parsing response';
                } else if (provider === 'gemini') {
                    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{ parts: [{ text: (jailbreakActive ? jailbreakPrompt + '\n' : '') + msg }] }]
