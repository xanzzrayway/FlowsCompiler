<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline Local Sync</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root { --primary: #6366f1; --bg: #0b0e14; --surface: #161b22; }
        body { background-color: var(--bg); color: #e6edf3; font-family: system-ui, sans-serif; }
        .glass-panel { background: var(--surface); border: 1px solid #30363d; border-radius: 12px; }
        .chat-msg { max-width: 85%; padding: 8px 12px; border-radius: 12px; margin-bottom: 8px; font-size: 0.9rem; }
        .msg-mine { background: var(--primary); align-self: flex-start; }
        .msg-theirs { background: #30363d; align-self: flex-end; }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden">

    <nav class="border-b border-gray-800 p-4 flex justify-between items-center bg-[#0d1117]">
        <div class="flex items-center gap-3">
            <h1 class="text-xl font-bold text-indigo-400">LocalSync <span class="text-gray-500 text-sm font-normal">| מצב אופליין</span></h1>
        </div>
        <div id="connection-status" class="text-xs px-3 py-1 rounded-full bg-gray-800 text-gray-400 flex items-center gap-2">
            <span class="status-dot bg-gray-500"></span>
            ממתין להגדרה...
        </div>
    </nav>

    <!-- Setup Layer -->
    <div id="setup-layer" class="fixed inset-0 z-50 bg-black/95 flex items-center justify-center p-4 text-center">
        <div class="glass-panel p-8 max-w-lg w-full">
            <h2 class="text-2xl font-bold mb-4">חיבור רשת מקומית (Offline)</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <button onclick="beHost()" class="p-6 border border-indigo-500/30 rounded-xl hover:bg-indigo-500/10 transition group">
                    <div class="text-3xl mb-2">🏠</div>
                    <div class="font-bold">אני המארח</div>
                    <p class="text-[10px] text-gray-500">צור הצעה לחיבור</p>
                </button>
                <button onclick="beClient()" class="p-6 border border-purple-500/30 rounded-xl hover:bg-purple-500/10 transition group">
                    <div class="text-3xl mb-2">📱</div>
                    <div class="font-bold">אני מתחבר</div>
                    <p class="text-[10px] text-gray-500">הדבק קוד מהמארח</p>
                </button>
            </div>
            
            <!-- Hidden inputs for Signaling -->
            <div id="signaling-box" class="mt-6 hidden">
                <p id="signal-label" class="text-xs text-gray-400 mb-2 font-bold uppercase"></p>
                <textarea id="signal-area" class="w-full h-32 bg-black/50 border border-gray-700 rounded p-2 text-[10px] font-mono mb-2" readonly></textarea>
                <button id="action-btn" class="w-full bg-indigo-600 py-2 rounded font-bold">העתק קוד</button>
                <p class="text-[10px] text-yellow-500 mt-2">העבר את הקוד למכשיר השני (דרך וואטסאפ או פתק) כדי ליצור את הצינור.</p>
            </div>
        </div>
    </div>

    <main class="flex-1 flex overflow-hidden">
        <!-- Sidebar: Chat -->
        <aside class="w-full md:w-80 border-l border-gray-800 flex flex-col glass-panel m-2">
            <div class="p-3 border-b border-gray-800 font-bold text-sm">צ'אט מקומי</div>
            <div id="chat-messages" class="flex-1 p-4 overflow-y-auto flex flex-col"></div>
            <div class="p-3 border-t border-gray-800 flex gap-2">
                <input type="text" id="chat-input" placeholder="הודעה..." class="flex-1 bg-black/20 border border-gray-700 rounded-lg px-3 py-1 text-sm focus:outline-none">
                <button onclick="sendChat()" class="bg-indigo-600 px-3 py-1 rounded-lg text-sm">שלח</button>
            </div>
        </aside>

        <!-- Main Explorer -->
        <section class="flex-1 flex flex-col p-4 overflow-hidden">
            <div class="flex justify-between items-center mb-6">
                <div>
                    <h2 class="text-xl font-bold">קבצים מסונכרנים</h2>
                    <p class="text-xs text-gray-500">העברה ישירה בתוך ה-WiFi</p>
                </div>
                <button onclick="document.getElementById('file-upload').click()" class="bg-indigo-600 hover:bg-indigo-700 px-4 py-2 rounded-lg text-sm font-medium">
                    + שתף קבצים
                </button>
                <input type="file" id="file-upload" class="hidden" multiple onchange="shareFiles(event)">
            </div>
            <div id="file-grid" class="grid grid-cols-2 lg:grid-cols-4 gap-4 overflow-y-auto"></div>
        </section>
    </main>

    <script>
        let pc = new RTCPeerConnection({ iceServers: [] }); // אין שרתי אינטרנט
        let dc; // Data Channel
        let role = '';

        // Role: HOST
        async function beHost() {
            role = 'host';
            document.getElementById('signaling-box').classList.remove('hidden');
            document.getElementById('signal-label').innerText = "קוד המארח שלך:";
            
            dc = pc.createDataChannel("chat");
            setupDataChannel();

            const offer = await pc.createOffer();
            await pc.setLocalDescription(offer);

            // Wait for ICE gathering to complete to get a full offer
            pc.onicecandidate = (e) => {
                if (!e.candidate) {
                    document.getElementById('signal-area').value = btoa(JSON.stringify(pc.localDescription));
                }
            };

            document.getElementById('action-btn').onclick = () => {
                document.getElementById('signal-area').select();
                document.execCommand('copy');
                alert("קוד הועתק! עכשיו בחר 'אני מתחבר' במכשיר השני והדבק אותו שם.");
                switchToInputMode("הדבק את קוד התגובה מהמכשיר השני:");
            };
        }

        // Role: CLIENT
        async function beClient() {
            role = 'client';
            document.getElementById('signaling-box').classList.remove('hidden');
            switchToInputMode("הדבק את קוד המארח:");
        }

        function switchToInputMode(label) {
            document.getElementById('signal-label').innerText = label;
            const area = document.getElementById('signal-area');
            area.readOnly = false;
            area.value = "";
            area.placeholder = "הדבק כאן...";
            
            document.getElementById('action-btn').innerText = "חבר מכשירים";
            document.getElementById('action-btn').onclick = async () => {
                const raw = document.getElementById('signal-area').value;
                try {
                    const signal = JSON.parse(atob(raw));
                    if (signal.type === 'offer') {
                        await pc.setRemoteDescription(signal);
                        const answer = await pc.createAnswer();
                        await pc.setLocalDescription(answer);
                        pc.onicecandidate = (e) => {
                            if (!e.candidate) {
                                document.getElementById('signal-area').value = btoa(JSON.stringify(pc.localDescription));
                                document.getElementById('signal-label').innerText = "שלח קוד תגובה למארח:";
                                document.getElementById('action-btn').innerText = "העתק תגובה";
                                document.getElementById('action-btn').onclick = () => {
                                    document.getElementById('signal-area').select();
                                    document.execCommand('copy');
                                    alert("תגובה הועתקה! הדבק אותה במכשיר המארח.");
                                };
                            }
                        };
                    } else if (signal.type === 'answer') {
                        await pc.setRemoteDescription(signal);
                    }
                } catch(e) { alert("קוד לא תקין"); }
            };
        }

        pc.ondatachannel = (e) => {
            dc = e.channel;
            setupDataChannel();
        };

        function setupDataChannel() {
            dc.onopen = () => {
                document.getElementById('setup-layer').style.display = 'none';
                updateStatus("מחובר אופליין", "green");
                addChatMessage("מערכת", "הצינור נוצר! העברת נתונים ישירה פעילה.");
            };
            dc.onmessage = (e) => {
                const data = JSON.parse(e.data);
                if (data.type === 'chat') addChatMessage("עמית", data.text);
                if (data.type === 'file') renderFile(data, false);
            };
        }

        function updateStatus(text, color) {
            const el = document.getElementById('connection-status');
            el.innerHTML = `<span class="status-dot bg-${color}-500"></span>${text}`;
        }

        function sendChat() {
            const input = document.getElementById('chat-input');
            const val = input.value.trim();
            if (!val || !dc || dc.readyState !== 'open') return;
            dc.send(JSON.stringify({ type: 'chat', text: val }));
            addChatMessage("אני", val);
            input.value = "";
        }

        function addChatMessage(sender, text) {
            const box = document.getElementById('chat-messages');
            const div = document.createElement('div');
            div.className = `chat-msg ${sender === 'אני' ? 'msg-mine' : 'msg-theirs'}`;
            div.innerHTML = `<div class="text-[10px] opacity-50">${sender}</div><div>${text}</div>`;
            box.appendChild(div);
            box.scrollTop = box.scrollHeight;
        }

        function shareFiles(e) {
            for (let file of e.target.files) {
                const reader = new FileReader();
                reader.onload = () => {
                    const data = { type: 'file', name: file.name, size: file.size, mime: file.type, blob: reader.result };
                    if(dc && dc.readyState === 'open') dc.send(JSON.stringify(data));
                    renderFile(data, true);
                };
                reader.readAsDataURL(file);
            }
        }

        function renderFile(file, isMine) {
            const grid = document.getElementById('file-grid');
            const div = document.createElement('div');
            div.className = "glass-panel p-4 flex flex-col items-center text-center";
            div.innerHTML = `
                <div class="text-3xl mb-2">${file.mime.includes('image') ? '🖼️' : '📄'}</div>
                <div class="text-xs font-bold truncate w-full">${file.name}</div>
                <a href="${file.blob}" download="${file.name}" class="mt-3 text-[10px] bg-indigo-600 px-3 py-1 rounded">${isMine ? 'שותף' : 'הורד'}</a>
            `;
            grid.appendChild(div);
        }

        document.getElementById('chat-input').addEventListener('keypress', e => e.key === 'Enter' && sendChat());
    </script>
</body>
</html>
