<!DOCTYPE html>    
<html lang="vi">    
<head>    
    <meta charset="UTF-8">    
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">    
    <title>Anh Hùng Sinh Tồn 2D - Đêm Kinh Hoàng</title>    
    <style>    
        * {    
            box-sizing: border-box;    
            user-select: none;    
            -webkit-user-select: none;    
            touch-action: manipulation;    
        }    
        body, html {    
            margin: 0; padding: 0;    
            width: 100%; height: 100%;    
            overflow: hidden;    
            background-color: #0f172a;    
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;    
        }    
        #game-container {    
            position: relative;    
            width: 100vw; height: 100vh;    
        }    
        canvas {    
            display: block;    
            background: #1e293b;    
        }    
  
        /* --- ANIMATIONS --- */    
        @keyframes gradientBG {  
            0% { background-position: 0% 50%; }  
            50% { background-position: 100% 50%; }  
            100% { background-position: 0% 50%; }  
        }  
        @keyframes floatTitle {  
            0% { transform: translateY(0px); }  
            50% { transform: translateY(-8px); }  
            100% { transform: translateY(0px); }  
        }  
        @keyframes pulseBtn {  
            0% { box-shadow: 0 4px 0 #047857, 0 0 10px rgba(16, 185, 129, 0.4); }  
            50% { box-shadow: 0 4px 0 #047857, 0 0 25px rgba(16, 185, 129, 0.8); }  
            100% { box-shadow: 0 4px 0 #047857, 0 0 10px rgba(16, 185, 129, 0.4); }  
        }  
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* --- SẢNH CHỜ --- */
        #lobby-screen {    
            position: absolute;    
            top: 0; left: 0; width: 100%; height: 100%;    
            background: linear-gradient(-45deg, #0f172a, #1e293b, #020617, #1e1b4b);  
            background-size: 400% 400%;  
            animation: gradientBG 12s ease infinite;  
            display: flex;    
            flex-direction: column;    
            justify-content: center;    
            align-items: center;    
            z-index: 30;    
            color: white;    
            padding: 20px;    
        }    
  
        .lobby-box {  
            background: rgba(15, 23, 42, 0.75);  
            backdrop-filter: blur(16px);  
            -webkit-backdrop-filter: blur(16px);  
            border: 2px solid rgba(255, 255, 255, 0.12);  
            padding: 30px 20px;  
            border-radius: 28px;  
            display: flex;  
            flex-direction: column;  
            align-items: center;  
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);  
            width: 90%;  
            max-width: 360px;  
        }  
  
        .game-title {    
            font-size: 30px;    
            font-weight: 900;    
            text-align: center;    
            color: #f59e0b;    
            margin-bottom: 4px;    
            text-transform: uppercase;    
            letter-spacing: 1.5px;    
            -webkit-text-stroke: 1px #78350f;    
            text-shadow: 0 0 15px rgba(245, 158, 11, 0.6);  
            animation: floatTitle 4s ease-in-out infinite;  
        }    
        .game-subtitle {    
            font-size: 11px;    
            color: #38bdf8;    
            font-weight: 800;    
            margin-bottom: 25px;    
            letter-spacing: 2px;    
            background: rgba(30, 41, 59, 0.8);    
            padding: 5px 14px;    
            border-radius: 20px;    
            border: 1px solid #0284c7;    
        }    
  
        .menu-btn {    
            width: 100%;    
            padding: 15px;    
            margin: 6px 0;    
            font-size: 16px;    
            font-weight: 900;    
            border-radius: 16px;    
            color: white;    
            cursor: pointer;    
            transition: all 0.15s ease;    
            display: flex;    
            justify-content: center;    
            align-items: center;    
            gap: 10px;    
            text-transform: uppercase;    
            border: none;  
            box-shadow: 0 4px 0 rgba(0, 0, 0, 0.3);  
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);  
        }    
          
        .btn-continue {    
            background: linear-gradient(135deg, #f59e0b, #d97706);    
            box-shadow: 0 4px 0 #92400e;  
        }    
        .btn-play {    
            background: linear-gradient(135deg, #10b981, #059669);    
            box-shadow: 0 4px 0 #047857;  
            animation: pulseBtn 2s infinite;  
        }    
        .btn-settings {    
            background: linear-gradient(135deg, #6366f1, #4f46e5);    
            box-shadow: 0 4px 0 #3730a3;  
        }    
        .menu-btn:active {     
            transform: translateY(3px);     
            box-shadow: 0 1px 0 rgba(0, 0, 0, 0.2) !important;  
        }    

        /* --- CẢNH LOADING --- */
        #loading-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #0f172a;
            z-index: 60;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
        }
        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid rgba(56, 189, 248, 0.2);
            border-top: 5px solid #38bdf8;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 20px;
        }
        .loading-text {
            font-size: 18px;
            font-weight: 800;
            color: #38bdf8;
            letter-spacing: 1px;
        }
        .loading-bar-container {
            width: 240px;
            height: 10px;
            background: #1e293b;
            border-radius: 10px;
            border: 1px solid #334155;
            margin-top: 15px;
            overflow: hidden;
        }
        #loading-bar {
            width: 0%;
            height: 100%;
            background: #10b981;
            transition: width 0.1s ease;
        }

        /* --- CÀI ĐẶT --- */    
        #settings-modal {    
            display: none;    
            position: absolute;    
            top: 0; left: 0; width: 100%; height: 100%;    
            background: rgba(15, 23, 42, 0.92);    
            z-index: 40;    
            flex-direction: column;    
            justify-content: center;    
            align-items: center;    
            color: white;    
        }    
        .settings-box {    
            background: #1e293b;    
            padding: 25px;    
            border-radius: 20px;    
            width: 85%;    
            max-width: 320px;    
            border: 2px solid #334155;    
        }    
        .setting-item {    
            margin: 18px 0;    
            display: flex;    
            justify-content: space-between;    
            align-items: center;    
            font-weight: bold;    
        }    
  
        /* --- HUD --- */    
        #ui-layer {    
            position: absolute;    
            top: 0; left: 0; width: 100%; height: 100%;    
            pointer-events: none;    
            display: none;    
        }    
        .stats-bar {    
            position: absolute;    
            top: 12px; left: 12px; right: 12px;    
            display: flex;    
            flex-direction: column;    
            gap: 6px;    
            color: white;    
            font-weight: 900;    
        }    
        .bar-container {    
            position: relative;    
            width: 100%;    
            height: 18px;    
            background: #0f172a;    
            border-radius: 10px;    
            overflow: hidden;    
            border: 2px solid #334155;    
        }    
        #hp-bar { width: 100%; height: 100%; background: #ef4444; transition: width 0.1s; }    
        #exp-bar { width: 0%; height: 100%; background: #0284c7; transition: width 0.1s; }    
            
        .bar-text {    
            position: absolute;    
            top: 50%; left: 50%;    
            transform: translate(-50%, -50%);    
            font-size: 10px;    
            color: #ffffff;    
            font-weight: 900;    
            pointer-events: none;    
        }    
  
        .info-header {    
            display: flex;    
            justify-content: space-between;    
            font-size: 13px;    
            background: #0f172a;    
            padding: 8px 14px;    
            border-radius: 12px;    
            border: 2px solid #334155;    
        }    
  
        /* TÚI ĐỒ */    
        .action-btns {    
            position: absolute;    
            bottom: 30px;    
            left: 20px;    
            display: flex;    
            gap: 10px;    
            z-index: 10;    
            pointer-events: auto;    
        }    
        .hud-btn {    
            width: 52px;    
            height: 52px;    
            border-radius: 16px;    
            border: none;    
            color: white;    
            font-size: 22px;    
            display: flex;    
            justify-content: center;    
            align-items: center;    
            cursor: pointer;    
        }    
        #inventory-btn { background: #f59e0b; border-bottom: 4px solid #b45309; }    
        .hud-btn:active { transform: translateY(2px); border-bottom-width: 2px; }    
  
        /* --- JOYSTICK --- */    
        #joystick-container {    
            position: absolute;    
            bottom: 40px;    
            left: 50%;    
            transform: translateX(-50%);    
            width: 120px;    
            height: 120px;    
            background: rgba(15, 23, 42, 0.6);    
            border: 3px solid #475569;    
            border-radius: 50%;    
            pointer-events: auto;    
            touch-action: none;    
        }    
        #joystick-stick {    
            position: absolute;    
            top: 50%; left: 50%;    
            width: 46px; height: 46px;    
            background: #38bdf8;    
            border: 3px solid #0284c7;    
            border-radius: 50%;    
            transform: translate(-50%, -50%);    
            pointer-events: none;    
        }    
  
        /* --- POPUP MODAL --- */    
        .modal-screen {    
            position: absolute;    
            top: 0; left: 0; width: 100%; height: 100%;    
            background: rgba(15, 23, 42, 0.92);    
            display: none;    
            flex-direction: column;    
            justify-content: center;    
            align-items: center;    
            z-index: 25;    
            pointer-events: auto;    
        }    
        .modal-screen h2 {    
            color: #facc15;    
            margin-bottom: 15px;    
            font-size: 22px;    
            text-transform: uppercase;    
            font-weight: 900;    
        }    
        .card-list {    
            display: flex;    
            flex-direction: column;    
            gap: 12px;    
            width: 88%;    
            max-width: 320px;    
            max-height: 65vh;    
            overflow-y: auto;    
        }    
        .card {    
            background: #1e293b;    
            border-radius: 16px;    
            padding: 14px;    
            color: white;    
            text-align: center;    
            cursor: pointer;    
            position: relative;    
            border: 2px solid #334155;    
            border-bottom-width: 5px;    
        }    
        .card.common { border-color: #38bdf8; }    
        .card.rare { border-color: #a855f7; }    
        .card.legendary { border-color: #facc15; background: #2a1f06; }    
        .card.secret { border-color: #ef4444; background: #3f1212; }    
            
        .card-rarity {    
            font-size: 10px;    
            font-weight: 900;    
            text-transform: uppercase;    
            margin-bottom: 3px;    
        }    
        .card.common .card-rarity { color: #38bdf8; }    
        .card.rare .card-rarity { color: #c084fc; }    
        .card.legendary .card-rarity { color: #facc15; }    
        .card.secret .card-rarity { color: #f87171; }    
  
        .card:active { transform: translateY(3px); border-bottom-width: 2px; }    
        .card-title { font-size: 15px; font-weight: 900; color: #ffffff; margin-bottom: 4px; }    
        .card-desc { font-size: 12px; color: #cbd5e1; font-weight: 600; }    
  
        .inventory-item {    
            background: #1e293b;    
            border: 2px solid #38bdf
