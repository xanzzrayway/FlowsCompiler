<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Control Dashboard</title>
  <style>
    /* PALET WARNA: Dark Futuristic (Deep Slate, Cyan Neon, Emerald & Rose) */
    :root {
      --bg-main: #0b0f19;
      --bg-card: rgba(20, 30, 48, 0.7);
      --neon-cyan: #06b6d4;
      --neon-emerald: #10b981;
      --neon-rose: #f43f5e;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background: radial-gradient(circle at top, #1e293b, var(--bg-main));
      color: var(--text-main);
      min-height: 100vh;
      overflow-x: hidden;
      padding: 20px;
    }

    .container {
      max-width: 600px;
      margin: 0 auto 100px auto;
    }

    /* HEADER STYLE */
    header {
      text-align: center;
      margin-bottom: 25px;
    }

    header h1 {
      font-size: 1.8rem;
      font-weight: 800;
      letter-spacing: 1px;
      background: linear-gradient(to right, var(--neon-cyan), var(--neon-emerald));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 5px;
    }

    header p {
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    /* CARD STYLE (GLASSMORPHISM) */
    .card {
      background: var(--bg-card);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    }

    .card-title {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 15px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* STATUS INDICATORS */
    .status-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .status-item {
      background: rgba(255, 255, 255, 0.03);
      border-radius: 12px;
      padding: 12px;
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .status-label {
      font-size: 0.75rem;
      color: var(--text-muted);
      text-transform: uppercase;
      margin-bottom: 5px;
    }

    .status-value {
      font-size: 0.95rem;
      font-weight: 700;
    }

    .val-online { color: var(--neon-emerald); }
    .val-offline { color: var(--neon-rose); }
    .val-neutral { color: var(--neon-cyan); }

    /* CAMERA VIEWPORT */
    .camera-box {
      position: relative;
      width: 100%;
      aspect-ratio: 4/3;
      background: #000;
      border-radius: 15px;
      overflow: hidden;
      margin-bottom: 15px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .camera-placeholder {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: var(--text-muted);
      font-size: 0.9rem;
      text-align: center;
      padding: 20px;
      background: rgba(10, 15, 25, 0.9);
      transition: opacity 0.3s ease;
    }

    /* CONTROLLER BUTTONS */
    .btn-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .btn {
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.05), rgba(255, 255, 255, 0.01));
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--text-main);
      padding: 14px;
      border-radius: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn:hover:not(:disabled) {
      background: rgba(255, 255, 255, 0.08);
      border-color: var(--neon-cyan);
      transform: translateY(-2px);
    }

    .btn:active:not(:disabled) {
      transform: translateY(0);
    }

    .btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .btn-primary {
      background: linear-gradient(135deg, #0284c7, #0369a1);
      border-color: var(--neon-cyan);
    }

    .btn-primary:hover:not(:disabled) {
      background: linear-gradient(135deg, #0ea5e9, #0284c7);
      box-shadow: 0 0 15px rgba(6, 182, 212, 0.4);
    }

    .btn-active {
      border-color: var(--neon-emerald) !important;
      color: var(--neon-emerald) !important;
      box-shadow: 0 0 15px rgba(16, 185, 129, 0.2);
    }

    /* FLOATING BALL */
    #floating-ball {
      position: fixed;
      bottom: 30px;
      right: 30px;
      width: 60px;
      height: 60px;
      background: radial-gradient(circle, var(--neon-cyan), #0369a1);
      border-radius: 50%;
      box-shadow: 0 0 20px rgba(6, 182, 212, 0.6), inset 0 2px 4px rgba(255,255,255,0.4);
      cursor: grab;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      touch-action: none; /* Cegah scroll saat di-drag */
      transition: transform 0.1s ease;
    }

    #floating-ball:active {
      cursor: grabbing;
      transform: scale(0.9);
    }

    #floating-ball svg {
      width: 28px;
      height: 28px;
      fill: #fff;
    }

    /* GLASS CALC MODAL */
    .calc-modal {
      display: none;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.9);
      width: 320px;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 24px;
      padding: 20px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
      z-index: 10000;
      opacity: 0;
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .calc-modal.active {
      display: block;
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }

    .calc-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    .calc-title {
      font-size: 1rem;
      font-weight: 700;
      color: var(--neon-cyan);
    }

    .close-calc {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 1.2rem;
    }

    .close-calc:hover {
      color: var(--neon-rose);
    }

    .calc-screen {
      width: 100%;
      height: 60px;
      background: rgba(0, 0, 0, 0.4);
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      padding: 10px 15px;
      text-align: right;
      font-size: 1.6rem;
      font-weight: 600;
      color: #fff;
      overflow-x: auto;
      white-space: nowrap;
      margin-bottom: 15px;
    }

    .calc-keys {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    .calc-key {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: var(--text-main);
      padding: 15px 0;
      font-size: 1.1rem;
      font-weight: 600;
      border-radius: 12px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .calc-key:hover {
      background: rgba(255, 255, 255, 0.12);
    }

    .calc-key.operator {
      color: var(--neon-cyan);
      background: rgba(6, 182, 212, 0.1);
    }

    .calc-key.clear {
      color: var(--neon-rose);
      background: rgba(244, 63, 94, 0.1);
    }

    .calc-key.equal {
      background: linear-gradient(135deg, var(--neon-cyan), #0369a1);
      color: #fff;
      grid-column: span 2;
    }

    /* BACKGROUND BLUR OVERLAY */
    .overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.5);
      z-index: 9998;
      backdrop-filter: blur(4px);
    }

    .overlay.active {
      display: block;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>NEXUS CONTROLLER</h1>
      <p>Multi-Control & Hardware Utility Dashboard</p>
    </header>

    <!-- CARD 1: DETEKSI SISTEM -->
    <div class="card">
      <div class="card-title">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path></svg>
        Sistem Detektor
      </div>
      <div class="status-group">
        <div class="status-item">
          <div class="status-label">Tipe App</div>
          <div id="env-status" class="status-value val-neutral">Scanning...</div>
        </div>
        <div class="status-item">
          <div class="status-label">Izin Kamera</div>
          <div id="perm-status" class="status-value val-offline">GAK ADA IZIN</div>
        </div>
      </div>
    </div>

    <!-- CARD 2: HARDWARE INTERFACE -->
    <div class="card">
      <div class="card-title">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path><circle cx="12" cy="13" r="4"></circle></svg>
        Kamera & Senter
      </div>

      <!-- Kamera Box Viewport -->
      <div class="camera-box">
        <video id="webcam" autoplay playsinline muted></video>
        <div id="cam-placeholder" class="camera-placeholder">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="margin-bottom:10px; opacity:0.6;"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path></svg>
          <p id="placeholder-text">Kamera belum diaktifkan atau izin ditolak.</p>
        </div>
      </div>

      <!-- Kontrol Kamera & Flashlight -->
      <div class="btn-grid">
        <button id="btn-toggle-cam" class="btn btn-primary" onclick="toggleCamera()">
          Aktifkan Kamera
        </button>
        <button id="btn-switch-cam" class="btn" onclick="switchCamera()" disabled>
          Ganti Kamera
        </button>
        <button id="btn-toggle-torch" class="btn" onclick="toggleTorch()" disabled>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"></path></svg>
          Senter
        </button>
        <button class="btn" onclick="checkHardwareCapabilities()">
          Refresh Device
        </button>
      </div>
    </div>
  </div>

  <!-- BOLA NGAMBANG (FLOATING ACTION BUTTON) -->
  <div id="floating-ball">
    <svg viewBox="0 0 24 24">
      <path d="M7 2h10a2 2 0 0 1 2 2v16a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2zM7 4v16h10V4H7zm2 2h6v2H9V6zm0 4h2v2H9v-2zm4 0h2v2h-2v-2zm-4 4h2v2H9v-2zm4 0h2v2h-2v-2zm-4 4h6v2H9v-2z"/>
    </svg>
  </div>

  <!-- BACKGROUND OVERLAY -->
  <div id="calc-overlay" class="overlay" onclick="closeCalculator()"></div>

  <!-- MODAL KALKULATOR -->
  <div id="calc-modal" class="calc-modal">
    <div class="calc-header">
      <div class="calc-title">NEXUS CALC</div>
      <button class="close-calc" onclick="closeCalculator()">&times;</button>
    </div>
    <div id="calc-screen" class="calc-screen">0</div>
    <div class="calc-keys">
      <button class="calc-key clear" onclick="clearCalc()">AC</button>
      <button class="calc-key operator" onclick="inputCalc('/')">/</button>
      <button class="calc-key operator" onclick="inputCalc('*')">&times;</button>
      <button class="calc-key operator" onclick="inputCalc('-')">-</button>
      
      <button class="calc-key" onclick="inputCalc('7')">7</button>
      <button class="calc-key" onclick="inputCalc('8')">8</button>
      <button class="calc-key" onclick="inputCalc('9')">9</button>
      <button class="calc-key operator" onclick="inputCalc('+')">+</button>
      
      <button class="calc-key" onclick="inputCalc('4')">4</button>
      <button class="calc-key" onclick="inputCalc('5')">5</button>
      <button class="calc-key" onclick="inputCalc('6')">6</button>
      <button class="calc-key" onclick="inputCalc('.')">.</button>
      
      <button class="calc-key" onclick="inputCalc('1')">1</button>
      <button class="calc-key" onclick="inputCalc('2')">2</button>
      <button class="calc-key" onclick="inputCalc('3')">3</button>
      <button class="calc-key equal" onclick="calculateResult()">=</button>
      
      <button class="calc-key" onclick="inputCalc('0')" style="grid-column: span 2;">0</button>
      <button class="calc-key" onclick="backspaceCalc()" style="grid-column: span 2;">DEL</button>
    </div>
  </div>

  <script>
    // State App
    let localStream = null;
    let currentFacingMode = 'environment'; // Default kamera belakang
    let isTorchOn = false;
    let track = null;

    // Detect Web vs APK (WebView)
    function checkAppType() {
      const ua = navigator.userAgent || navigator.vendor || window.opera;
      const isWebView = /WebView|wv|Android.*Version\/[0-9.]+/i.test(ua);
      const envStatusEl = document.getElementById('env-status');
      
      if (isWebView) {
        envStatusEl.textContent = 'APK (WebView)';
        envStatusEl.className = 'status-value val-online';
      } else {
        envStatusEl.textContent = 'Web Browser';
        envStatusEl.className = 'status-value val-neutral';
      }
    }

    // Check Permissions
    async function checkPermissions() {
      const permStatusEl = document.getElementById('perm-status');
      const btnToggleCam = document.getElementById('btn-toggle-cam');
      
      try {
        const result = await navigator.permissions.query({ name: 'camera' });
        updatePermissionUI(result.state);
        
        result.onchange = () => {
          updatePermissionUI(result.state);
        };
      } catch (err) {
        // Fallback jika API permissions query tidak support
        if (localStream) {
          updatePermissionUI('granted');
        } else {
          permStatusEl.textContent = 'SCANNING...';
          permStatusEl.className = 'status-value val-neutral';
        }
      }
    }

    function updatePermissionUI(state) {
      const permStatusEl = document.getElementById('perm-status');
      const btnSwitchCam = document.getElementById('btn-switch-cam');
      const btnToggleTorch = document.getElementById('btn-toggle-torch');

      if (state === 'granted') {
        permStatusEl.textContent = 'IZIN OK';
        permStatusEl.className = 'status-value val-online';
      } else if (state === 'denied') {
        permStatusEl.textContent = 'DITOLAK';
        permStatusEl.className = 'status-value val-offline';
        // Lock controls if permission denied
        disableCameraSystem();
      } else {
        permStatusEl.textContent = 'BUTUH IZIN';
        permStatusEl.className = 'status-value val-neutral';
      }
    }

    function disableCameraSystem() {
      document.getElementById('btn-switch-cam').disabled = true;
      document.getElementById('btn-toggle-torch').disabled = true;
      stopCamera();
    }

    // Camera Controls
    async function toggleCamera() {
      const video = document.getElementById('webcam');
      const placeholder = document.getElementById('cam-placeholder');
      const btnToggle = document.getElementById('btn-toggle-cam');
      const btnSwitch = document.getElementById('btn-switch-cam');

      if (localStream) {
        // Stop kamera
        stopCamera();
        btnToggle.textContent = 'Aktifkan Kamera';
        btnToggle.classList.remove('btn-active');
        placeholder.style.opacity = '1';
        btnSwitch.disabled = true;
      } else {
        // Start kamera
        try {
          const constraints = {
            video: {
              facingMode: currentFacingMode,
              width: { ideal: 1280 },
              height: { ideal: 720 }
            },
            audio: false
          };

          localStream = await navigator.mediaDevices.getUserMedia(constraints);
          video.srcObject = localStream;
          placeholder.style.opacity = '0';
          btnToggle.textContent = 'Matikan Kamera';
          btnToggle.classList.add('btn-active');
          btnSwitch.disabled = false;
          
          track = localStream.getVideoTracks()[0];
          
          updatePermissionUI('granted');
          checkTorchAvailability();

        } catch (err) {
          console.error("Gagal akses kamera: ", err);
          updatePermissionUI('denied');
          alert('Gabisa buka kamera. Pastiin udah kasih izin akses kamera!');
        }
      }
    }

    function stopCamera() {
      if (localStream) {
        localStream.getTracks().forEach(track => track.stop());
        localStream = null;
        track = null;
      }
      const video = document.getElementById('webcam');
      video.srcObject = null;
      
      const btnTorch = document.getElementById('btn-toggle-torch');
      btnTorch.disabled = true;
      btnTorch.classList.remove('btn-active');
      isTorchOn = false;
    }

    async function switchCamera() {
      if (!localStream) return;
      currentFacingMode = (currentFacingMode === 'user') ? 'environment' : 'user';
      stopCamera();
      await toggleCamera();
    }

    // Torch / Senter Control
    async function checkTorchAvailability() {
      const btnTorch = document.getElementById('btn-toggle-torch');
      if (!track) return;

      try {
        const capabilities = track.getCapabilities();
        // Check if torch (flashlight) is supported
        if (capabilities.torch) {
          btnTorch.disabled = false;
        } else {
          btnTorch.disabled = true;
        }
      } catch (err) {
        // Device gak support senter lewat browser
        btnTorch.disabled = true;
      }
    }

    async function toggleTorch() {
      if (!track) return;
      const btnTorch = document.getElementById('btn-toggle-torch');

      try {
        isTorchOn = !isTorchOn;
        await track.applyConstraints({
          advanced: [{ torch: isTorchOn }]
        });
        
        if (isTorchOn) {
          btnTorch.classList.add('btn-active');
        } else {
          btnTorch.classList.remove('btn-active');
        }
      } catch (err) {
        alert('Gagal mengontrol senter hardware.');
        btnTorch.disabled = true;
      }
    }

    function checkHardwareCapabilities() {
      checkPermissions();
      if (localStream) {
        checkTorchAvailability();
      } else {
        alert('Aktifkan kamera dulu buat ngetes kecocokan hardware.');
      }
    }

    // DRAGGABLE FLOATING BALL LOGIC
    const ball = document.getElementById('floating-ball');
    let isDragging = false;
    let currentX;
    let currentY;
    let initialX;
    let initialY;
    let xOffset = 0;
    let yOffset = 0;

    ball.addEventListener('touchstart', dragStart, { passive: true });
    ball.addEventListener('touchend', dragEnd, { passive: true });
    ball.addEventListener('touchmove', drag, { passive: true });

    ball.addEventListener('mousedown', dragStart);
    document.addEventListener('mouseup', dragEnd);
    document.addEventListener('mousemove', drag);

    function dragStart(e) {
      let clientX, clientY;
      if (e.type === 'touchstart') {
        clientX = e.touches[0].clientX;
        clientY = e.touches[0].clientY;
      } else {
        clientX = e.clientX;
        clientY = e.clientY;
      }

      initialX = clientX - xOffset;
      initialY = clientY - yOffset;

      if (e.target === ball || ball.contains(e.target)) {
        isDragging = true;
      }
    }

    function dragEnd(e) {
      initialX = currentX;
      initialY = currentY;
      isDragging = false;
    }

    function drag(e) {
      if (!isDragging) return;

      let clientX, clientY;
      if (e.type === 'touchmove') {
        clientX = e.touches[0].clientX;
        clientY = e.touches[0].clientY;
      } else {
        clientX = e.clientX;
        clientY = e.clientY;
      }

      currentX = clientX - initialX;
      currentY = clientY - initialY;

      xOffset = currentX;
      yOffset = currentY;

      setTranslate(currentX, currentY, ball);
    }

    function setTranslate(xPos, yPos, el) {
      el.style.transform = `translate3d(${xPos}px, ${yPos}px, 0)`;
    }

    // Click handler on Floating Ball (to open calc)
    let touchMoved = false;
    ball.addEventListener('touchmove', () => touchMoved = true);
    ball.addEventListener('touchstart', () => touchMoved = false);
    
    ball.addEventListener('click', (e) => {
      if (touchMoved) return; // ignore click if dragged
      openCalculator();
    });

    ball.addEventListener('touchend', (e) => {
      if (!touchMoved) {
        openCalculator();
      }
    });

    // CALCULATOR LOGIC
    const calcScreen = document.getElementById('calc-screen');
    let calcExpression = '';

    function openCalculator() {
      document.getElementById('calc-modal').classList.add('active');
      document.getElementById('calc-overlay').classList.add('active');
    }

    function closeCalculator() {
      document.getElementById('calc-modal').classList.remove('active');
      document.getElementById('calc-overlay').classList.remove('active');
    }

    function inputCalc(val) {
      if (calcExpression === 'Error' || calcExpression === '0') {
        calcExpression = '';
      }
      calcExpression += val;
      updateCalcScreen();
    }

    function clearCalc() {
      calcExpression = '0';
      updateCalcScreen();
    }

    function backspaceCalc() {
      if (calcExpression.length > 0 && calcExpression !== 'Error') {
        calcExpression = calcExpression.slice(0, -1);
        if (calcExpression === '') calcExpression = '0';
      }
      updateCalcScreen();
    }

    function calculateResult() {
      try {
        // Gunakan Function constructor sebagai pengganti eval demi performa dan keamanan
        const result = new Function(`return ${calcExpression}`)();
        calcExpression = String(result);
      } catch (err) {
        calcExpression = 'Error';
      }
      updateCalcScreen();
    }

    function updateCalcScreen() {
      calcScreen.textContent = calcExpression || '0';
    }

    // Initialize App
    window.onload = () => {
      checkAppType();
      checkPermissions();
    };
  </script>
</body>
</html>
