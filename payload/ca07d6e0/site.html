<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nubia Game Space & Pro Crosshair</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800;900&family=Rajdhani:wght@500;700&display=swap');
        
        body {
            font-family: 'Rajdhani', sans-serif;
            background-color: #05070b;
            color: #ffffff;
            overflow: hidden;
            user-select: none;
        }
        .font-orbitron {
            font-family: 'Orbitron', sans-serif;
        }
        .nubia-glass {
            background: rgba(13, 17, 23, 0.85);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 68, 68, 0.25);
            box-shadow: 0 0 25px rgba(255, 68, 68, 0.1);
        }
        .nubia-red-glow {
            text-shadow: 0 0 12px rgba(255, 51, 51, 0.8);
        }
        .nubia-border-glow {
            border: 1px solid rgba(255, 68, 68, 0.5);
            box-shadow: 0 0 15px rgba(255, 68, 68, 0.2);
        }
        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        ::-webkit-scrollbar-track {
            background: #05070b;
        }
        ::-webkit-scrollbar-thumb {
            background: #ff3333;
            border-radius: 2px;
        }
    </style>
</head>
<body class="w-screen h-screen flex flex-col justify-between relative">

    <!-- BACKGROUND ANIMATED RED/ORANGE LIGHTS (NUBIA STYLE) -->
    <div class="absolute inset-0 overflow-hidden pointer-events-none z-0">
        <div class="absolute -top-32 -left-32 w-96 h-96 bg-red-600/10 rounded-full blur-[120px]"></div>
        <div class="absolute -bottom-32 -right-32 w-96 h-96 bg-orange-600/10 rounded-full blur-[120px]"></div>
        <!-- Center Radar Rings Animation -->
        <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[500px] h-[500px] border border-red-500/10 rounded-full animate-ping opacity-20 pointer-events-none"></div>
        <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[300px] h-[300px] border border-orange-500/10 rounded-full opacity-30 pointer-events-none"></div>
    </div>

    <!-- MAIN DASHBOARD VIEW (LANDSCAPE) -->
    <div id="main-dashboard" class="relative z-10 flex-1 flex flex-col justify-between p-5 overflow-hidden">
        
        <!-- Top Bar: Status & Controls -->
        <div class="flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="w-9 h-9 rounded-lg bg-gradient-to-tr from-red-600 to-orange-500 flex items-center justify-center nubia-border-glow">
                    <i class="fa-solid fa-gamepad text-black font-black text-sm"></i>
                </div>
                <div>
                    <h1 class="font-orbitron font-black text-base tracking-wider text-red-500 nubia-red-glow">REDMAGIC SPACE</h1>
                    <p class="text-[10px] text-slate-400 tracking-widest">ENGINE v9.0 PRO</p>
                </div>
            </div>

            <!-- System Stats Center -->
            <div class="hidden sm:flex items-center space-x-5 bg-black/60 px-5 py-1.5 rounded-full border border-red-500/20 text-xs font-orbitron">
                <div class="flex items-center space-x-1.5">
                    <i class="fa-solid fa-microchip text-red-400"></i>
                    <span class="text-slate-400">CPU:</span>
                    <span id="stat-cpu" class="text-red-300 font-bold">34%</span>
                </div>
                <div class="w-px h-3 bg-slate-700"></div>
                <div class="flex items-center space-x-1.5">
                    <i class="fa-solid fa-temperature-half text-orange-400"></i>
                    <span class="text-slate-400">Suhu:</span>
                    <span class="text-orange-300 font-bold">31.2°C</span>
                </div>
                <div class="w-px h-3 bg-slate-700"></div>
                <div class="flex items-center space-x-1.5">
                    <i class="fa-solid fa-wifi text-emerald-400"></i>
                    <span class="text-slate-400">Ping:</span>
                    <span id="stat-ping" class="text-emerald-300 font-bold">16ms</span>
                </div>
            </div>

            <!-- Top Right Icons -->
            <div class="flex items-center space-x-3 text-slate-300">
                <button onclick="alert('Plugin & Aksesoris Terhubung')" class="w-9 h-9 rounded-xl nubia-glass flex items-center justify-center hover:text-red-400 transition">
                    <i class="fa-solid fa-puzzle-piece text-sm"></i>
                </button>
                <button onclick="alertpengaturan()" class="w-9 h-9 rounded-xl nubia-glass flex items-center justify-center hover:text-red-400 transition">
                    <i class="fa-solid fa-gear text-sm"></i>
                </button>
            </div>
        </div>

        <!-- Center Arena: Nubia Logo / Rotating Core & Game Carousel -->
        <div class="flex-1 flex items-center justify-center relative my-2">
            
            <!-- Left Add App Button (Sesuai Foto 1) -->
            <div class="absolute left-4 z-20 flex flex-col items-center">
                <button onclick="openAddModal()" class="w-14 h-14 rounded-2xl nubia-glass flex flex-col items-center justify-center text-red-500 hover:scale-110 hover:border-red-500 transition shadow-lg group">
                    <i class="fa-solid fa-plus text-lg group-hover:rotate-90 transition duration-300"></i>
                </button>
                <span class="text-[10px] font-orbitron text-slate-400 mt-1 tracking-wider">TAMBAH</span>
            </div>

            <!-- Center Core Graphic (RedMagic V-Shape Hub) -->
            <div class="relative w-48 h-48 sm:w-56 sm:h-56 flex items-center justify-center pointer-events-none">
                <div class="absolute inset-0 rounded-full border-2 border-red-500/20 animate-spin" style="animation-duration: 20s;"></div>
                <div class="absolute inset-3 rounded-full border border-orange-500/30"></div>
                <div class="absolute w-24 h-24 rounded-full bg-gradient-to-tr from-red-600/30 to-orange-500/20 blur-xl"></div>
                <!-- Core Emblem -->
                <div class="w-20 h-20 rounded-2xl nubia-glass flex items-center justify-center nubia-border-glow transform rotate-45">
                    <i class="fa-solid fa-fire text-3xl text-red-500 transform -rotate-45 drop-shadow-[0_0_10px_rgba(255,51,51,0.8)]"></i>
                </div>
            </div>

            <!-- Game & App Cards Horizontal List (Dynamic Container) -->
            <div class="absolute right-4 left-24 sm:left-32 overflow-x-auto flex space-x-4 py-2 px-1 scrollbar-none items-center" id="game-list-container">
                
                <!-- Item 1: Free Fire MAX -->
                <div onclick="launchGame('Free Fire MAX', 'https://images.unsplash.com/photo-1542751371-adc38448a05e?auto=format&fit=crop&w=800&q=80')" class="flex-shrink-0 w-36 sm:w-44 h-24 sm:h-28 rounded-2xl nubia-glass overflow-hidden relative group cursor-pointer hover:border-red-500 transition transform hover:-scale-105">
                    <div class="absolute inset-0 bg-cover bg-center opacity-70 group-hover:opacity-100 transition" style="background-image: url('https://images.unsplash.com/photo-1542751371-adc38448a05e?auto=format&fit=crop&w=800&q=80');"></div>
                    <div class="absolute inset-0 bg-gradient-to-t from-black via-black/40 to-transparent"></div>
                    <div class="absolute bottom-2.5 left-3 right-3 flex justify-between items-end">
                        <div>
                            <div class="text-[11px] font-orbitron font-bold text-white truncate">Free Fire MAX</div>
                            <div class="text-[9px] text-red-400">FPS 90 • Ready</div>
                        </div>
                        <div class="w-7 h-7 rounded-lg bg-red-600 text-black flex items-center justify-center text-xs font-bold shadow-md">
                            <i class="fa-solid fa-play"></i>
                        </div>
                    </div>
                </div>

                <!-- Item 2: PUBG Mobile -->
                <div onclick="launchGame('PUBG Mobile', 'https://images.unsplash.com/photo-1538481199705-c710c4e965fc?auto=format&fit=crop&w=800&q=80')" class="flex-shrink-0 w-36 sm:w-44 h-24 sm:h-28 rounded-2xl nubia-glass overflow-hidden relative group cursor-pointer hover:border-red-500 transition transform hover:-scale-105">
                    <div class="absolute inset-0 bg-cover bg-center opacity-70 group-hover:opacity-100 transition" style="background-image: url('https://images.unsplash.com/photo-1538481199705-c710c4e965fc?auto=format&fit=crop&w=800&q=80');"></div>
                    <div class="absolute inset-0 bg-gradient-to-t from-black via-black/40 to-transparent"></div>
                    <div class="absolute bottom-2.5 left-3 right-3 flex justify-between items-end">
                        <div>
                            <div class="text-[11px] font-orbitron font-bold text-white truncate">PUBG Mobile</div>
                            <div class="text-[9px] text-red-400">FPS 60 • Ready</div>
                        </div>
                        <div class="w-7 h-7 rounded-lg bg-red-600 text-black flex items-center justify-center text-xs font-bold shadow-md">
                            <i class="fa-solid fa-play"></i>
                        </div>
                    </div>
                </div>

                <!-- Item 3: Mobile Legends -->
                <div onclick="launchGame('Mobile Legends', 'https://images.unsplash.com/photo-1511512578047-dfb367046420?auto=format&fit=crop&w=800&q=80')" class="flex-shrink-0 w-36 sm:w-44 h-24 sm:h-28 rounded-2xl nubia-glass overflow-hidden relative group cursor-pointer hover:border-red-500 transition transform hover:-scale-105">
                    <div class="absolute inset-0 bg-cover bg-center opacity-70 group-hover:opacity-100 transition" style="background-image: url('https://images.unsplash.com/photo-1511512578047-dfb367046420?auto=format&fit=crop&w=800&q=80');"></div>
                    <div class="absolute inset-0 bg-gradient-to-t from-black via-black/40 to-transparent"></div>
                    <div class="absolute bottom-2.5 left-3 right-3 flex justify-between items-end">
                        <div>
                            <div class="text-[11px] font-orbitron font-bold text-white truncate">Mobile Legends</div>
                            <div class="text-[9px] text-red-400">FPS 120 • Ready</div>
                        </div>
                        <div class="w-7 h-7 rounded-lg bg-red-600 text-black flex items-center justify-center text-xs font-bold shadow-md">
                            <i class="fa-solid fa-play"></i>
                        </div>
                    </div>
                </div>

            </div>
        </div>

        <!-- Bottom Navigation Bar (Nubia Style) -->
        <div class="flex justify-center items-center">
            <div class="nubia-glass px-6 py-2 rounded-2xl flex items-center space-x-6 text-xs font-orbitron border border-red-500/20">
                <button class="text-red-400 flex items-center space-x-2 font-bold">
                    <i class="fa-solid fa-house"></i>
                    <span>Game Lobby</span>
                </button>
                <div class="w-px h-3 bg-slate-700"></div>
                <button onclick="openAddModal()" class="text-slate-400 hover:text-red-400 flex items-center space-x-2 transition">
                    <i class="fa-solid fa-folder-plus"></i>
                    <span>Super Base</span>
                </button>
                <div class="w-px h-3 bg-slate-700"></div>
                <button onclick="alert('Mode Performa: Beast Mode Aktif!')" class="text-slate-400 hover:text-red-400 flex items-center space-x-2 transition">
                    <i class="fa-solid fa-gauge-high"></i>
                    <span>Beast Mode</span>
                </button>
            </div>
        </div>

    </div>

    <!-- MODAL TAMBAH GAME / APLIKASI -->
    <div id="add-app-modal" class="hidden fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex items-center justify-center p-4">
        <div class="nubia-glass w-full max-w-md rounded-2xl p-6 space-y-5 border border-red-500/40 shadow-2xl">
            <div class="flex justify-between items-center border-b border-slate-800 pb-3">
                <h3 class="font-orbitron font-bold text-base text-red-400 flex items-center space-x-2">
                    <i class="fa-solid fa-square-plus"></i>
                    <span>Tambah Game / Aplikasi Lain</span>
                </h3>
                <button onclick="closeAddModal()" class="text-slate-400 hover:text-white text-lg"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="space-y-4">
                <div>
                    <label class="text-xs font-orbitron text-slate-300 block mb-1">Nama Game / Aplikasi</label>
                    <input type="text" id="new-app-name" placeholder="Contoh: Genshin Impact" class="w-full bg-black/60 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-red-500">
                </div>
                <div>
                    <label class="text-xs font-orbitron text-slate-300 block mb-1">URL Gambar Sampul (Opsional)</label>
                    <input type="text" id="new-app-img" placeholder="https://link-gambar.com/foto.jpg" class="w-full bg-black/60 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-red-500">
                </div>
            </div>
            <div class="flex justify-end space-x-3 pt-2">
                <button onclick="closeAddModal()" class="px-4 py-2 rounded-xl bg-slate-800 text-slate-300 text-xs font-orbitron hover:bg-slate-700 transition">Batal</button>
                <button onclick="addNewApp()" class="px-5 py-2 rounded-xl bg-gradient-to-r from-red-600 to-orange-500 text-black font-bold text-xs font-orbitron hover:opacity-90 transition shadow-lg shadow-red-600/30">Tambahkan</button>
            </div>
        </div>
    </div>

    <!-- GAMEPLAY SIMULATION & CROSSHAIR PRO OVERLAY (LANDSCAPE AREA) -->
    <div id="game-arena" class="hidden fixed inset-0 z-50 bg-black flex flex-col select-none">
        <!-- Background Game Arena Simulation -->
        <div id="arena-bg" class="absolute inset-0 bg-cover bg-center filter brightness-90" style="background-image: url('');">
            <div class="absolute inset-0 bg-black/40"></div>
            
            <!-- Simulated In-Game HUD (Nubia Game Space Side Overlay Panel) -->
            <div class="absolute top-4 left-4 flex items-center space-x-3 bg-black/70 backdrop-blur-md px-4 py-2 rounded-xl border border-white/10">
                <div class="w-7 h-7 rounded-full bg-red-600 flex items-center justify-center font-bold text-black text-xs">99</div>
                <div>
                    <div class="text-xs font-bold text-white font-orbitron uppercase" id="active-game-name">Free Fire MAX</div>
                    <div class="text-[9px] text-emerald-400 flex items-center space-x-1">
                        <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-ping"></span>
                        <span>LIVE • 90 FPS • 16ms</span>
                    </div>
                </div>
            </div>

            <!-- Virtual On-Screen Game Controls Simulation -->
            <div class="absolute bottom-6 left-6 w-28 h-28 rounded-full border-2 border-white/25 bg-white/5 flex items-center justify-center pointer-events-none">
                <div class="w-10 h-10 rounded-full bg-red-500/30 border border-red-500"></div>
            </div>
            <div class="absolute bottom-6 right-6 flex space-x-3 pointer-events-none">
                <div class="w-12 h-12 rounded-full bg-red-600/40 border border-red-500 flex items-center justify-center text-white font-bold text-[10px]">FIRE</div>
                <div class="w-10 h-10 rounded-full bg-white/20 border border-white/30 flex items-center justify-center text-white text-[10px]">JUMP</div>
            </div>
        </div>

        <!-- THE CUSTOMIZABLE CROSSHAIR OVERLAY (Bisa Pindah Posisi, Ganti Warna & Jenis Sesuai Foto 3) -->
        <div id="crosshair-wrapper" class="absolute inset-0 flex items-center justify-center pointer-events-none transition-all duration-75" style="transform: translate(0px, 0px);">
            <div id="crosshair-inner" class="relative flex items-center justify-center transition-all" style="transform: scale(1); opacity: 1;">
                <!-- Default Crosshair Element -->
                <div id="ch-element" class="relative flex items-center justify-center w-10 h-10">
                    <div class="absolute w-5 h-1.5 rounded-sm shadow-[0_0_10px_currentColor]" style="background-color: #22c55e; left: 0;"></div>
                    <div class="absolute w-5 h-1.5 rounded-sm shadow-[0_0_10px_currentColor]" style="background-color: #22c55e; right: 0;"></div>
                    <div class="absolute w-1.5 h-5 rounded-sm shadow-[0_0_10px_currentColor]" style="background-color: #22c55e; top: 0;"></div>
                    <div class="absolute w-1.5 h-5 rounded-sm shadow-[0_0_10px_currentColor]" style="background-color: #22c55e; bottom: 0;"></div>
                </div>
            </div>
        </div>

        <!-- FLOATING SIDE DRAWER: CROSSHAIR PRO SETTINGS PANEL (Persis Foto 2 & Foto 3) -->
        <div class="absolute right-0 top-0 bottom-0 w-full sm:w-[380px] nubia-glass border-l border-red-500/30 shadow-2xl flex flex-col z-50">
            
            <!-- Panel Header -->
            <div class="p-4 border-b border-slate-800 flex justify-between items-center bg-black/40">
                <div class="flex items-center space-x-2.5">
                    <div class="w-8 h-8 rounded-lg bg-red-600/20 text-red-400 flex items-center justify-center border border-red-500/40">
                        <i class="fa-solid fa-crosshairs text-sm"></i>
                    </div>
                    <div>
                        <h3 class="font-orbitron font-bold text-sm text-white tracking-wide">Crosshair Pro</h3>
                        <p class="text-[10px] text-slate-400">Aim Assistant Overlay</p>
                    </div>
                </div>
                <div class="flex items-center space-x-2">
                    <!-- Master Toggle Switch -->
                    <label class="relative inline-flex items-center cursor-pointer">
                        <input type="checkbox" id="master-ch-toggle" checked onchange="toggleMasterCrosshair(this)" class="sr-only peer">
                        <div class="w-9 h-5 bg-slate-700 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-emerald-500"></div>
                    </label>
                    <button onclick="exitGame()" class="w-8 h-8 rounded-lg bg-red-600/20 text-red-400 hover:bg-red-600 hover:text-black transition flex items-center justify-center border border-red-500/30" title="Keluar Game">
                        <i class="fa-solid fa-xmark text-sm"></i>
                    </button>
                </div>
            </div>

            <!-- Panel Controls Body -->
            <div class="flex-1 overfl
